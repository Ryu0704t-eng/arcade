      for (const br of S.bricks) {
        const x0 = bx(br.c), y0 = by(br.r);
        const cx = clampN(x, x0, x0 + w), cy = clampN(y, y0, y0 + BH);
        const dx = x - cx, dy = y - cy;
        if (dx * dx + dy * dy < r * r) return br;
      }
      return null;
    }
    function damage(br) {
      br.hp--;
      const cx = bx(br.c) + bw() / 2, cy = by(br.r) + BH / 2;
      if (br.hp > 0) { A.beep(300, 0.06, 'square', 0.03); return; }
      S.bricks.splice(S.bricks.indexOf(br), 1);
      S.combo++; S.broken++;
      if (S.combo > S.maxCombo) S.maxCombo = S.combo;
      const pts = (br.max > 1 ? 20 : 10) * getMult();
      S.score += pts;
      burstTo(S.parts, cx, cy, br.max > 1 ? '#cfd6ff' : br.col, 7, 120);
      pop(cx, cy, '+' + pts, '#eef0ff', 13);
      A.beep(SCALE[S.combo % 8], 0.07, 'square', 0.035);
      if (Math.random() < 0.13) {
        const r = Math.random();
        S.drops.push({ x: cx, y: cy, type: r < 0.5 ? 'wide' : r < 0.85 ? 'slow' : (S.lives < 5 ? 'life' : 'wide') });
      }
      if (!S.bricks.length) {
        S.sub = 'clear'; S.clearT = 1.3;
        const bonus = 100 * S.level;
        S.score += bonus;
        pop(W / 2, 220, 'ステージクリア! +' + bonus, '#ffd45e', 22);
        [523, 659, 784, 1047].forEach((f, i) => A.beep(f, 0.18, 'triangle', 0.06, 0, i * 0.08));
      }
    }
    function loseLife() {
      S.lives--; S.combo = 0; S.shake = 0.35; S.flash = 1;
      A.beep(180, 0.3, 'sawtooth', 0.07, -110);
      if (S.lives <= 0) { endGame(); return; }
      S.sub = 'ready'; S.ready = 1.4; S.wideT = 0; S.slowT = 0; S.drops = [];
    }
    function moveBall(dt) {
      const b = S.ball, pw = padW(), py = padY(), sf = S.slowT > 0 ? 0.7 : 1;
      const n = Math.max(1, Math.ceil(Math.hypot(b.vx, b.vy) * dt * sf / 4));
      const sdx = b.vx * dt * sf / n, sdy = b.vy * dt * sf / n;
      for (let i = 0; i < n; i++) {
        b.x += sdx;
        if (b.x < b.r) { b.x = b.r; b.vx = Math.abs(b.vx); fixAngle(); }
        else if (b.x > W - b.r) { b.x = W - b.r; b.vx = -Math.abs(b.vx); fixAngle(); }
        let br = brickAt(b.x, b.y, b.r);
        if (br) { b.x -= sdx; b.vx = -b.vx; damage(br); fixAngle(); if (S.sub !== 'fly') return; }
        b.y += sdy;
        if (b.y < TOP + b.r) { b.y = TOP + b.r; b.vy = Math.abs(b.vy); fixAngle(); }
        br = brickAt(b.x, b.y, b.r);
        if (br) { b.y -= sdy; b.vy = -b.vy; damage(br); fixAngle(); if (S.sub !== 'fly') return; }
        if (b.vy > 0 && b.y + b.r >= py && b.y - b.r <= py + PH && Math.abs(b.x - S.px) <= pw / 2 + b.r * 0.6) {
          const rel = clampN((b.x - S.px) / (pw / 2), -1, 1), a = rel * 60 * Math.PI / 180;
          b.vx = S.sp * Math.sin(a); b.vy = -S.sp * Math.cos(a); b.y = py - b.r;
          S.combo = 0;
          A.beep(220, 0.05, 'sine', 0.05);
        }
        if (b.y - b.r > H) { loseLife(); return; }
      }
    }
    function update(dt) {
      S.t += dt;
      if (keys.l) S.tx -= 520 * dt;
      if (keys.r) S.tx += 520 * dt;
      const pw = padW();
      S.tx = clampN(S.tx, pw / 2, W - pw / 2);
      S.px = clampN(S.px + (S.tx - S.px) * Math.min(1, dt * 22), pw / 2, W - pw / 2);
      S.wideT = Math.max(0, S.wideT - dt); S.slowT = Math.max(0, S.slowT - dt);
      const b = S.ball, py = padY();
      if (S.sub === 'ready') {
        b.x = S.px; b.y = py - b.r - 1; S.ready -= dt;
        if (S.ready <= 0) launch();
      } else if (S.sub === 'clear') {
        S.clearT -= dt;
        if (S.clearT <= 0) { S.level++; newLevel(); }
      } else moveBall(dt);
      if (S.mode !== 'play') return;
      for (let i = S.drops.length - 1; i >= 0; i--) {
        const d = S.drops[i];
        d.y += 130 * dt;
        if (d.y > py - 8 && d.y < py + PH + 14 && Math.abs(d.x - S.px) <= pw / 2 + 12) {
          S.drops.splice(i, 1);
          if (d.type === 'wide') { S.wideT = 10; pop(S.px, py - 30, 'ワイド!', '#7fd1ff', 18); }
          else if (d.type === 'slow') { S.slowT = 8; pop(S.px, py - 30, 'スロー!', '#8fe08f', 18); }
          else { S.lives = Math.min(5, S.lives + 1); pop(S.px, py - 30, 'ライフ +1', '#ff6b81', 18); }
          A.beep(880, 0.12, 'triangle', 0.06);
        } else if (d.y > H + 20) S.drops.splice(i, 1);
      }
      S.shake = Math.max(0, S.shake - dt); S.flash = Math.max(0, S.flash - dt * 2.5);
      stepParts(S.parts, dt); stepPops(S.pops, dt);
    }

    function draw(time) {
      ctx.save();
      if (S.shake > 0 && !reduce) ctx.translate((Math.random() - 0.5) * S.shake * 18, (Math.random() - 0.5) * S.shake * 18);
      drawSky(ctx, W, H, time, false);
      const w = bw();
      for (const br of S.bricks) {
        const x = bx(br.c), y = by(br.r);
        rrect(ctx, x, y, w, BH, 5);
        ctx.fillStyle = br.max > 1 ? (br.hp > 1 ? '#cfd6ff' : '#8a93c9') : br.col; ctx.fill();
        rrect(ctx, x + 2, y + 2, w - 4, 5, 3); ctx.fillStyle = 'rgba(255,255,255,0.22)'; ctx.fill();
      }
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      for (const d of S.drops) {
        rrect(ctx, d.x - 15, d.y - 10, 30, 20, 10);
        ctx.fillStyle = { wide: '#7fd1ff', slow: '#8fe08f', life: '#ff6b81' }[d.type]; ctx.fill();
        ctx.fillStyle = '#0a0c2c'; ctx.font = '700 13px ' + FONT;
        ctx.fillText({ wide: 'ワ', slow: 'ゆ', life: '♥' }[d.type], d.x, d.y + 1);
      }
      const pw = padW(), py = padY();
      const gl = ctx.createRadialGradient(S.px, py, 4, S.px, py, pw * 0.8);
      gl.addColorStop(0, 'rgba(111,227,207,0.3)'); gl.addColorStop(1, 'rgba(111,227,207,0)');
      ctx.fillStyle = gl; ctx.fillRect(S.px - pw, py - pw, pw * 2, pw * 1.6);
      rrect(ctx, S.px - pw / 2, py, pw, PH, 6);
      const pg = ctx.createLinearGradient(0, py, 0, py + PH);
      pg.addColorStop(0, S.wideT > 0 ? '#bfe6ff' : '#8ff0de'); pg.addColorStop(1, S.wideT > 0 ? '#4a9be0' : '#2fa89a');
      ctx.fillStyle = pg; ctx.fill();
      const b = S.ball;
      ctx.save(); ctx.shadowColor = '#ffffff'; ctx.shadowBlur = S.slowT > 0 ? 6 : 14;
      if (!Skin.draw(ctx, b.x, b.y, b.r * 1.5, 0)) { ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 6.283); ctx.fillStyle = S.slowT > 0 ? '#c9f5c9' : '#ffffff'; ctx.fill(); } ctx.restore();
      drawParts(ctx, S.parts);
      drawPops(ctx, S.pops);
      if (S.mode === 'idle' || (S.mode === 'play' && S.sub === 'ready' && S.level === 1 && S.broken === 0)) {
        ctx.font = '700 14px ' + FONT; ctx.fillStyle = '#a3aae0';
        ctx.fillText('ドラッグかマウスでバーを動かす', W / 2, py - 40);
        ctx.font = '500 12px ' + FONT;
        ctx.fillText('タップかスペースキーで発射', W / 2, py - 20);
      }
      ctx.restore();
      if (S.flash > 0 && !reduce) { ctx.fillStyle = 'rgba(255,107,129,' + (S.flash * 0.28) + ')'; ctx.fillRect(0, 0, W, H); }
    }

    function setText(key, v) { if (cache[key] !== v) { cache[key] = v; k(key).textContent = v; } }
    function hud() {
      setText('score', String(S.score));
      setText('lvTxt', 'ステージ ' + S.level);
      setText('combo', S.combo + ' コンボ ×' + getMult());
      const sc = S.combo >= 2;
      if (cache.cs !== sc) { cache.cs = sc; k('combo').classList.toggle('off', !sc); }
      const lk = String(S.lives);
      if (cache.lk !== lk) {
        cache.lk = lk;
        let html = '';
        for (let i = 0; i < Math.max(3, S.lives); i++) html += '<span class="' + (i < S.lives ? '' : 'off') + '">♥</span>';
        k('lives').innerHTML = html;
      }
    }
    function endGame() {
      S.mode = 'over';
      [523, 440, 349, 262].forEach((f, i) => A.beep(f, 0.25, 'triangle', 0.06, 0, i * 0.14));
      api.end(S.score, [['ステージ', S.level], ['こわした数', S.broken], ['最大コンボ', S.maxCombo]]);
    }

    const setTx = (e) => { const r = stage.getBoundingClientRect(); if (S) S.tx = e.clientX - r.left; };
    const onDown = (e) => { setTx(e); if (S && S.mode === 'play' && S.sub === 'ready') launch(); };
    const onKeyDown = (e) => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') { keys.l = true; e.preventDefault(); }
      else if (e.code === 'ArrowRight' || e.code === 'KeyD') { keys.r = true; e.preventDefault(); }
      else if (e.code === 'Space' && S && S.mode === 'play' && S.sub === 'ready') { e.preventDefault(); launch(); }
    };
    const onKeyUp = (e) => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.l = false;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.r = false;
    };
    stage.addEventListener('pointermove', setTx);
    stage.addEventListener('pointerdown', onDown);
    window.addEventListener('keydown', onKeyDown);
    window.addEventListener('keyup', onKeyUp);

    function frame(ts) {
      const dt = Math.min(0.05, (ts - last) / 1000 || 0) * DT();
      last = ts;
      if (S.mode === 'play') update(dt);
      draw(ts / 1000);
      hud();
      raf = requestAnimationFrame(frame);
    }
    resize();
    S = makeState('idle');
    const ro = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(resize) : null;
    if (ro) ro.observe(stage);
    raf = requestAnimationFrame(frame);

    return {
      start() { S = makeState('play'); Object.keys(cache).forEach((n) => delete cache[n]); },
      pause() { if (S.mode === 'play') S.mode = 'paused'; },
      resume() { if (S.mode === 'paused') S.mode = 'play'; },
      destroy() {
        cancelAnimationFrame(raf); if (ro) ro.disconnect();
        stage.removeEventListener('pointermove', setTx); stage.removeEventListener('pointerdown', onDown);
        window.removeEventListener('keydown', onKeyDown); window.removeEventListener('keyup', onKeyUp);
      }
    };
  }

  /* ===== ゲーム8: ナンバータッチ ===== */
  function createNums(stage, api) {
    const root = el('div', 'pg', `
      <div class="pg-hud">
        <div class="score"><span class="lbl">スコア</span><span class="num" data-k="score">0</span></div>
        <div class="pg-time"><span class="chip" data-k="tm">60秒</span><div class="lv-track wide"><i data-k="tFill" style="width:100%"></i></div></div>
      </div>
      <div class="pg-sub"><span data-k="nx">つぎは 1</span><span class="chip off" data-k="combo">0 コンボ ×1</span></div>
      <div class="ng-grid" data-k="grid"></div>
      <div class="pg-foot"><span data-k="msg"></span><button class="pill" type="button" data-k="quit">おわる</button></div>`);
    stage.append(root);
    const k = (n) => root.querySelector('[data-k="' + n + '"]');
    const grid = k('grid');
    const TOTAL = 60, TMAX = 90;
    let raf = 0, last = 0, timers = [], phase = 'idle', paused = false, quitArm = 0, curN = 3;
    let time = TOTAL, score = 0, combo = 0, maxCombo = 0, board = 0, wrongs = 0, next = 1, total = 9;
    const cache = {};
    const later = (fn, ms) => { const id = setTimeout(fn, ms); timers.push(id); return id; };
    const mult = () => Math.min(4, 1 + Math.floor(combo / 10));
    const msg = (t) => { k('msg').textContent = t || ''; };
    const sizeFor = (b) => (b < 1 ? 3 : b < 3 ? 4 : 5);

    function size(n) {
      const gap = 8;
      const aw = Math.min(440, stage.clientWidth - 32), ah = stage.clientHeight - 32 - 180;
      const cs = clampN(Math.floor(Math.min((aw - gap * (n - 1)) / n, (ah - gap * (n - 1)) / n)), 44, 96);
      root.style.setProperty('--cs', cs + 'px');
      root.style.setProperty('--cols', String(n));
      root.style.setProperty('--gw', (cs * n + gap * (n - 1)) + 'px');
    }
    function fill(n, active) {
      curN = n; size(n);
      const nums = shuffle(Array.from({ length: n * n }, (_, i) => i + 1));
      grid.innerHTML = nums.map((v) => '<button class="nc" type="button" data-v="' + v + '"' + (active ? '' : ' tabindex="-1"') + '>' + v + '</button>').join('');
      total = n * n; next = 1;
    }
    function newBoard() { fill(sizeFor(board), true); phase = 'play'; msg(''); }

    function onGrid(e) {
      const b = e.target.closest('.nc[data-v]');
      if (!b || phase !== 'play') return;
      const v = parseInt(b.dataset.v, 10);
      if (v === next) {
        b.classList.add('done');
        combo++; if (combo > maxCombo) maxCombo = combo;
        const pts = 10 * mult();
        score += pts; next++;
        A.beep(SCALE[combo % 8], 0.06, 'sine', 0.05);
        if (next > total) {
          phase = 'clear';
          const bonus = 5 * total;
          score += bonus; time = Math.min(TMAX, time + 3);
          msg('クリア! +' + bonus + '点 ・ +3秒');
          [523, 659, 784, 1047].forEach((f, n) => A.beep(f, 0.16, 'triangle', 0.06, 0, n * 0.07));
          later(() => { board++; newBoard(); }, 700);
        }
      } else {
        wrongs++; combo = 0; time -= 2;
        b.classList.remove('bad'); void b.offsetWidth; b.classList.add('bad');
        msg('-2秒');
        A.beep(170, 0.18, 'sawtooth', 0.06, -90);
      }
    }
    function finish() {
      if (phase === 'over') return;
      phase = 'over';
      [523, 440, 349, 262].forEach((f, i) => A.beep(f, 0.25, 'triangle', 0.06, 0, i * 0.14));
      api.end(score, [['クリア盤面', board], ['最大コンボ', maxCombo], ['まちがい', wrongs]]);
    }
    function setText(key, v) { if (cache[key] !== v) { cache[key] = v; k(key).textContent = v; } }
    function hud() {
      setText('score', String(score));
      setText('tm', Math.max(0, Math.ceil(time)) + '秒');
      const w = clampN(time / TOTAL * 100, 0, 100).toFixed(1) + '%';
      if (cache.w !== w) { cache.w = w; k('tFill').style.width = w; }
      setText('nx', phase === 'idle' ? 'ちいさい順にタッチ' : 'つぎは ' + Math.min(next, total));
      setText('combo', combo + ' コンボ ×' + mult());
      const sc = combo >= 2;
      if (cache.cs !== sc) { cache.cs = sc; k('combo').classList.toggle('off', !sc); }
    }
    function frame(ts) {
      const dt = Math.min(0.05, (ts - last) / 1000 || 0) * DT();
      last = ts;
      if ((phase === 'play' || phase === 'clear') && !paused) { time -= dt; if (time <= 0) { time = 0; finish(); } }
      hud();
      raf = requestAnimationFrame(frame);
    }
    const onQuit = () => {
      if (phase === 'over' || phase === 'idle') return;
      if (!quitArm) {
        k('quit').textContent = '本当におわる?';
        quitArm = setTimeout(() => { quitArm = 0; k('quit').textContent = 'おわる'; }, 2500);
        timers.push(quitArm);
      } else { clearTimeout(quitArm); quitArm = 0; k('quit').textContent = 'おわる'; finish(); }
    };
    grid.addEventListener('click', onGrid);
    k('quit').addEventListener('click', onQuit);
    fill(3, false);
    const ro = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(() => size(curN)) : null;
    if (ro) ro.observe(stage);
    raf = requestAnimationFrame(frame);

    return {
      start() {
        timers.forEach(clearTimeout); timers = [];
        time = TOTAL; score = 0; combo = 0; maxCombo = 0; board = 0; wrongs = 0; paused = false; quitArm = 0;
        k('quit').textContent = 'おわる';
        Object.keys(cache).forEach((n) => delete cache[n]);
        newBoard();
      },
      pause() { paused = true; },
      resume() { paused = false; },
      destroy() { cancelAnimationFrame(raf); timers.forEach(clearTimeout); if (ro) ro.disconnect(); grid.removeEventListener('click', onGrid); }
    };
  }

  /* ===== 4択クイズの共通部分(さんすうダッシュ・いろあて) ===== */
  function createQuiz(stage, api, cfg) {
    const root = el('div', 'qz', `
      <div class="qz-hud">
        <div class="score"><span class="lbl">スコア</span><span class="num" data-k="score">0</span></div>
        <div class="pg-time"><span class="chip" data-k="tm"></span><div class="lv-track wide"><i data-k="tFill" style="width:100%"></i></div></div>
      </div>
      <div class="qz-q" data-k="q"></div>
      <div class="qz-opts" data-k="opts"></div>
      <div class="qz-foot"><span class="qz-msg" data-k="msg"></span><span class="chip off" data-k="combo">0 コンボ ×1</span><button class="pill" type="button" data-k="quit">おわる</button></div>`);
    stage.append(root);
    const k = (n) => root.querySelector('[data-k="' + n + '"]');
    const qBox = k('q'), optBox = k('opts');
    let raf = 0, last = 0, timers = [], phase = 'idle', paused = false, lock = false, quitArm = 0, qStart = 0;
    let time = cfg.total, score = 0, combo = 0, maxCombo = 0, n = 0, correct = 0, wrong = 0, cur = null;
    const cache = {};
    const later = (fn, ms) => { const id = setTimeout(fn, ms); timers.push(id); return id; };
    const mult = () => Math.min(5, 1 + Math.floor(combo / 4));
    const msg = (t) => { k('msg').textContent = t || ''; };

    function showQ() {
      cur = cfg.next({ n, correct });
      qBox.innerHTML = cur.html;
      optBox.textContent = '';
      optBox.style.gridTemplateColumns = cur.opts.length === 3 ? 'repeat(3, 1fr)' : '';
      cur.opts.forEach((label, i) => {
        const b = el('button', 'qo');
        b.type = 'button'; b.dataset.i = String(i);
        const kk = el('span', 'kk'); kk.textContent = String(i + 1);
        const tx = el('span', 'tx'); tx.textContent = label;
        b.append(kk, tx);
        optBox.append(b);
      });
      lock = false; qStart = performance.now();
    }
    function answer(i) {
      if (phase !== 'play' || lock || !cur || i >= cur.opts.length) return;
      lock = true;
      const btns = optBox.children, ok = i === cur.ans;
      if (ok) {
        const fast = (performance.now() - qStart) / 1000 <= cfg.quick;
        combo++; if (combo > maxCombo) maxCombo = combo;
        const pts = 10 * mult() + (fast ? 5 : 0);
        score += pts; correct++; n++;
        btns[i].classList.add('ok');
        msg('+' + pts + (fast ? ' 速い!' : ''));
        A.beep(SCALE[combo % 8], 0.1, 'sine', 0.06);
        later(showQ, 160);
      } else {
        wrong++; combo = 0; n++; time -= cfg.penalty;
        btns[i].classList.add('ng'); btns[cur.ans].classList.add('ok');
        msg('-' + cfg.penalty + '秒');
        A.beep(170, 0.2, 'sawtooth', 0.06, -90);
        later(showQ, 520);
      }
    }
    function finish() {
      if (phase === 'over') return;
      phase = 'over'; lock = true;
      [523, 440, 349, 262].forEach((f, i) => A.beep(f, 0.25, 'triangle', 0.06, 0, i * 0.14));
      api.end(score, cfg.stats({ correct, wrong, maxCombo }));
    }
    function setText(key, v) { if (cache[key] !== v) { cache[key] = v; k(key).textContent = v; } }
    function hud() {
      setText('score', String(score));
      setText('tm', Math.max(0, Math.ceil(time)) + '秒');
      const w = clampN(time / cfg.total * 100, 0, 100).toFixed(1) + '%';
      if (cache.w !== w) { cache.w = w; k('tFill').style.width = w; }
      setText('combo', combo + ' コンボ ×' + mult());
      const sc = combo >= 2;
      if (cache.cs !== sc) { cache.cs = sc; k('combo').classList.toggle('off', !sc); }
    }
    function frame(ts) {
      const dt = Math.min(0.05, (ts - last) / 1000 || 0) * DT();
      last = ts;
      if (phase === 'play' && !paused) { time -= dt; if (time <= 0) { time = 0; finish(); } }
      hud();
      raf = requestAnimationFrame(frame);
    }
    const onOpts = (e) => { const b = e.target.closest('.qo'); if (b) answer(parseInt(b.dataset.i, 10)); };
    const onKey = (e) => { const m = /^(?:Digit|Numpad)([1-4])$/.exec(e.code); if (m && phase === 'play') { e.preventDefault(); answer(parseInt(m[1], 10) - 1); } };
    const onQuit = () => {
      if (phase === 'over' || phase === 'idle') return;
      if (!quitArm) {
        k('quit').textContent = '本当におわる?';
        quitArm = setTimeout(() => { quitArm = 0; k('quit').textContent = 'おわる'; }, 2500);
        timers.push(quitArm);
      } else { clearTimeout(quitArm); quitArm = 0; k('quit').textContent = 'おわる'; finish(); }
    };
    optBox.addEventListener('click', onOpts);
    window.addEventListener('keydown', onKey);
    k('quit').addEventListener('click', onQuit);
    showQ();
    raf = requestAnimationFrame(frame);

    return {
      start() {
        timers.forEach(clearTimeout); timers = [];
        time = cfg.total; score = 0; combo = 0; maxCombo = 0; n = 0; correct = 0; wrong = 0; paused = false; quitArm = 0;
        k('quit').textContent = 'おわる'; msg('');
        Object.keys(cache).forEach((nm) => delete cache[nm]);
        phase = 'play'; showQ();
      },
      pause() { paused = true; },
      resume() { paused = false; },

  /* ===== ゲーム9: さんすうダッシュ ===== */
  function mathNext(ctx) {
    const lv = ctx.n < 4 ? 0 : ctx.n < 10 ? 1 : ctx.n < 18 ? 2 : 3;
    let text, ans;
    if (lv === 0) {
      if (Math.random() < 0.6) { const a = rndInt(2, 9), b = rndInt(2, 9); text = a + ' + ' + b; ans = a + b; }
      else { const a = rndInt(6, 18), b = rndInt(1, Math.min(9, a - 1)); text = a + ' − ' + b; ans = a - b; }
    } else if (lv === 1) {
      if (Math.random() < 0.5) { const a = rndInt(10, 40), b = rndInt(5, 30); text = a + ' + ' + b; ans = a + b; }
      else { const a = rndInt(20, 60), b = rndInt(5, Math.min(40, a - 1)); text = a + ' − ' + b; ans = a - b; }
    } else if (lv === 2) {
      const a = rndInt(2, 9), b = rndInt(2, 9); text = a + ' × ' + b; ans = a * b;
    } else if (Math.random() < 0.5) {
      const a = rndInt(3, 12), b = rndInt(3, 12); text = a + ' × ' + b; ans = a * b;
    } else {
      const a = rndInt(2, 20), b = rndInt(2, 9), c = rndInt(2, 6); text = a + ' + ' + b + ' × ' + c; ans = a + b * c;
    }
    const cand = shuffle([ans + 1, ans - 1, ans + 2, ans - 2, ans + 10, ans - 10, ans + rndInt(3, 6), ans - rndInt(3, 6)]).filter((v, i, arr) => v >= 0 && v !== ans && arr.indexOf(v) === i);
    for (let d = 3; cand.length < 3; d++) if (ans + d !== ans && cand.indexOf(ans + d) < 0) cand.push(ans + d);
    const opts = shuffle([ans].concat(cand.slice(0, 3)));
    return { html: '<div class="big">' + text + '</div><div class="sub">= ?</div>', opts: opts.map(String), ans: opts.indexOf(ans) };
  }
  const createMath = (stage, api) => createQuiz(stage, api, {
    total: 45, penalty: 3, quick: 1.6, next: mathNext,
    stats: (s) => [['せいかい', s.correct], ['最大コンボ', s.maxCombo], ['まちがい', s.wrong]]
  });

    const inkRule = Math.floor(ctx.n / 6) % 2 === 0;
    const w = rndInt(0, 4), c = Math.random() < 0.75 ? (w + rndInt(1, 4)) % 5 : w;
    const target = inkRule ? c : w;
    const others = shuffle([0, 1, 2, 3, 4].filter((i) => i !== target)).slice(0, 3);
    const order = shuffle([target].concat(others));
    const tag = inkRule ? '<span class="tag t-ink">もじの「いろ」をえらぶ</span>' : '<span class="tag t-read">もじを「よむ」</span>';
    return { html: tag + '<div class="big" style="color:' + INKS[c][1] + '">' + INKS[w][0] + '</div>', opts: order.map((i) => INKS[i][0]), ans: order.indexOf(target) };
  }

  /* ===== ゲーム13: ほしランナー ===== */
  function createRunner(stage, api) {
    const root = el('div', 'gm', `
      <canvas class="cv" aria-label="ほしランナーのゲーム画面"></canvas>

        <div class="rc-url"><label class="btn mini rc-file">📁 ファイルから<input data-k="file" type="file" accept="image/*" hidden></label><span class="rc-msg" data-k="cmsg"></span></div>

    stage.append(root);

    const cv = $('canvas', root), ctx = cv.getContext('2d');
    const R = 14;
    let W = 360, H = 600, raf = 0, last = 0, S = null;
    const cache = {};
    const gyF = () => H - 96;
    const pxF = () => Math.min(120, W * 0.24);
    const speed = () => Math.min(520, 240 + S.t * 5);
    const meters = () => Math.floor(S.dist / 12);
    const pop = (x, y, text, c, size) => S.pops.push({ x, y, text, c, size: size || 16, life: 0 });
    function resize() { const d = fitCanvas(cv, ctx, stage); W = d.W; H = d.H; }
    /* ---- キャラえらび ---- */
    const CHARS = ['⭐', '🐱', '🐶', '🐰', '🦊', '🐼', '🐸', '🐧', '🐤', '🦄', '🐷', '🚀', '👾', '⚽', '🍙', '🍩'];
    let ch = { k: 'emoji', v: '⭐' }, chImg = null;
    try { const sv = JSON.parse(localStorage.getItem('runnerChar') || 'null'); if (sv && (sv.k === 'emoji' || sv.k === 'img') && typeof sv.v === 'string' && sv.v.length < 400000) ch = sv; } catch (e) { /* noop */ }
    if (!localStorage.getItem('runnerChar') && Skin.k) ch = { k: Skin.k, v: Skin.v };
    function loadImg(src, ok, ng) { const im = new Image(); im.onload = () => ok(im); im.onerror = ng; im.src = src; }
    if (ch.k === 'img') loadImg(ch.v, (im) => { chImg = im; }, () => { ch = { k: 'emoji', v: '⭐' }; });
    function saveCh() { try { localStorage.setItem('runnerChar', JSON.stringify(ch)); } catch (e) { /* noop */ } if (ch.k === 'img') Skin.set('img', ch.v, chImg); else if (ch.v === '⭐') Skin.clear(); else Skin.set('emoji', ch.v); }
    function buildPicker() {
      const grid = k('grid'); grid.textContent = '';
      CHARS.forEach((c) => { const b = el('button', 'rc-c' + (ch.k === 'emoji' && ch.v === c ? ' on' : '')); b.type = 'button'; b.textContent = c; b.addEventListener('click', () => { ch = { k: 'emoji', v: c }; chImg = null; saveCh(); buildPicker(); }); grid.append(b); });
      if (ch.k === 'img') { const b = el('button', 'rc-c on'); b.type = 'button'; const im = el('img'); im.src = ch.v; im.alt = 'じぶんの画像'; b.append(im); grid.append(b); }
    }
    const cmsg = (t) => { k('cmsg').textContent = t || ''; };
    function setImg(src) { cmsg('よみこみ中…'); loadImg(src, (im) => { ch = { k: 'img', v: src }; chImg = im; saveCh(); buildPicker(); cmsg('画像をセットしました!'); }, () => { cmsg('画像を読み込めませんでした(リンクを確かめてね)'); }); }
    k('urlGo').addEventListener('click', () => { const u = k('url').value.trim(); if (!/^https?:\/\//i.test(u)) { cmsg('https:// から始まる画像のリンクを入れてね'); return; } setImg(u); });
    k('file').addEventListener('change', () => {
      const f = k('file').files && k('file').files[0]; if (!f) return; if (!/^image\//.test(f.type)) { cmsg('画像ファイルをえらんでね'); return; }
      const fr = new FileReader(); fr.onload = () => { loadImg(String(fr.result), (im) => { const c = document.createElement('canvas'); c.width = c.height = 96; const x = c.getContext('2d'); const sc = Math.max(96 / im.width, 96 / im.height); x.drawImage(im, (96 - im.width * sc) / 2, (96 - im.height * sc) / 2, im.width * sc, im.height * sc); setImg(c.toDataURL('image/png')); }, () => cmsg('画像を読み込めませんでした')); }; fr.readAsDataURL(f);
    });
    k('go').addEventListener('click', () => { k('pick').hidden = true; S = makeState('play'); Object.keys(cache).forEach((n) => delete cache[n]); });
    k('pick').addEventListener('pointerdown', (e) => e.stopPropagation());
    function drawChar(px, py, ang, dying, time) {
      if (ch.k === 'img' && chImg) {
        const r = R + 6; ctx.save(); ctx.translate(px, py); ctx.rotate(ang); ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.283); ctx.clip(); ctx.drawImage(chImg, -r, -r, r * 2, r * 2); ctx.restore();
        ctx.save(); ctx.strokeStyle = dying ? '#ff6b81' : '#ffd45e'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(px, py, R + 6, 0, 6.283); ctx.stroke(); ctx.restore(); return;
      }
      if (ch.k === 'emoji' && ch.v !== '⭐') {
        ctx.save(); ctx.translate(px, py); ctx.rotate(ang); ctx.font = Math.round((R + 6) * 2) + 'px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; if (dying && Math.floor(time * 14) % 2) ctx.globalAlpha = 0.5; ctx.fillText(ch.v, 0, 2); ctx.restore(); return;
      }
      ctx.save(); ctx.shadowColor = dying ? '#ff6b81' : '#ffd45e'; ctx.shadowBlur = 16;
      starPath(ctx, px, py, R + 4, ang);
      ctx.fillStyle = dying ? (Math.floor(time * 14) % 2 ? '#ff6b81' : '#ffc2cb') : '#ffd45e'; ctx.fill(); ctx.restore();
      ctx.fillStyle = '#2b2204';
      ctx.beginPath(); ctx.arc(px - 3, py - 2, 1.8, 0, 6.283); ctx.arc(px + 4, py - 2, 1.8, 0, 6.283); ctx.fill();
    }
    function makeState(mode) {
      return { mode, t: 0, dist: 0, stars: 0, jumps: 0, py: gyF() - R, vy: 0, jc: 0, obs: [], coins: [], gap: 520, parts: [], pops: [], shake: 0, flash: 0, dead: 0, scroll: 0 };
    }
    function jump() {
      if (!S || S.mode !== 'play' || S.jc >= 2) return;
      S.vy = S.jc === 0 ? -640 : -560; S.jc++; S.jumps++;
      burstTo(S.parts, pxF(), S.py + R, '#ffd45e', 5, 80);
      A.beep(S.jc === 1 ? 520 : 700, 0.08, 'triangle', 0.05, 120);
    }
    function spawn(v) {
      const gy = gyF(), r = Math.random(), x = W + 40;
      let o;
      if (S.t < 8 || r < 0.5) o = { type: 'rock', x, w: rndInt(26, 40), h: rndInt(28, 50) };
      else if (S.t < 18 || r < 0.82) o = { type: 'spike', x, w: 26 * rndInt(1, 2), h: 26 };
      else o = { type: 'bird', x, y: gy - 62, w: 0, h: 0, vx: -90 };
      S.obs.push(o);
      if (Math.random() < 0.65) {
        if (o.type === 'bird') { for (let i = 0; i < 3; i++) S.coins.push({ x: x + 30 + i * 34, y: gy - 20 }); }
        else { const cx = x + o.w / 2; for (let i = 0; i < 3; i++) S.coins.push({ x: cx + (i - 1) * 46, y: gy - o.h - 62 - (i === 1 ? 16 : 0) }); }
      }
      S.gap = v * 0.62 + 80 + Math.random() * 240;
    }
    function hit(o) {
      const cx = pxF(), cy = S.py, cr = R * 0.82, gy = gyF();
      if (o.type === 'bird') return Math.hypot(o.x - cx, o.y - cy) < cr + 11;
      let rx = o.x, ry = gy - o.h, rw = o.w, rh = o.h;
      if (o.type === 'spike') { rx += 5; rw -= 10; ry += 7; rh -= 7; }
      const nx = clampN(cx, rx, rx + rw), ny = clampN(cy, ry, ry + rh);
      return (cx - nx) * (cx - nx) + (cy - ny) * (cy - ny) < cr * cr;
    }
    function die() {
      S.mode = 'dying'; S.dead = 0.7; S.shake = 0.4; S.flash = 1;
      burstTo(S.parts, pxF(), S.py, '#ff6b81', 18, 190);
      A.beep(180, 0.35, 'sawtooth', 0.07, -110);
    }
    function update(dt) {
      if (S.mode === 'dying') {
        S.dead -= dt;
        if (S.dead <= 0) { endGame(); return; }
      } else {
        S.t += dt;
        const v = speed(), gy = gyF(), px = pxF();
        S.dist += v * dt; S.scroll += v * dt;
        S.vy += 1900 * dt; S.py += S.vy * dt;
        if (S.py >= gy - R) { S.py = gy - R; S.vy = 0; S.jc = 0; }
        S.gap -= v * dt;
        if (S.gap <= 0) spawn(v);
        for (let i = S.obs.length - 1; i >= 0; i--) {
          const o = S.obs[i];
          o.x -= (v + (o.vx || 0)) * dt;
          if (o.x + o.w < -60) { S.obs.splice(i, 1); continue; }
          if (hit(o)) { die(); break; }
        }
        if (S.mode === 'play') {
          for (let i = S.coins.length - 1; i >= 0; i--) {
            const c = S.coins[i];
            c.x -= v * dt;
            if (c.x < -20) { S.coins.splice(i, 1); continue; }
            if (Math.hypot(c.x - px, c.y - S.py) < R + 10) {
              S.coins.splice(i, 1); S.stars++;
              burstTo(S.parts, c.x, c.y, '#fff0a0', 6, 100);
              pop(c.x, c.y - 16, '+10', '#fff0a0', 14);
              A.beep(SCALE[S.stars % 8] * 2, 0.07, 'sine', 0.05);
            }
          }
        }
      }
      S.shake = Math.max(0, S.shake - dt); S.flash = Math.max(0, S.flash - dt * 2.5);
      stepParts(S.parts, dt); stepPops(S.pops, dt);
    }

    function draw(time) {
      ctx.save();
      if (S.shake > 0 && !reduce) ctx.translate((Math.random() - 0.5) * S.shake * 18, (Math.random() - 0.5) * S.shake * 18);
      drawSky(ctx, W, H, time, false);
      const gy = gyF(), px = pxF();
      ctx.fillStyle = '#10134a'; ctx.beginPath(); ctx.moveTo(0, gy);
      for (let x = 0; x <= W + 10; x += 10) { const xx = x + S.scroll * 0.25; ctx.lineTo(x, gy - 34 - Math.sin(xx * 0.012) * 20 - Math.sin(xx * 0.031) * 8); }
      ctx.lineTo(W, gy); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#0a0c2e'; ctx.fillRect(0, gy, W, H - gy);
      ctx.fillStyle = '#2b3080'; ctx.fillRect(0, gy, W, 3);
      ctx.fillStyle = 'rgba(160,170,255,0.25)';
      const off = S.scroll % 48;
      for (let x = -off; x < W; x += 48) ctx.fillRect(x, gy + 18, 22, 3);
      for (const o of S.obs) {
        if (o.type === 'rock') {
          rrect(ctx, o.x, gy - o.h, o.w, o.h, 6);
          const g = ctx.createLinearGradient(0, gy - o.h, 0, gy);
          g.addColorStop(0, '#7a76f0'); g.addColorStop(1, '#4a48c0');
          ctx.fillStyle = g; ctx.fill();
          ctx.fillStyle = 'rgba(255,255,255,0.18)'; rrect(ctx, o.x + 3, gy - o.h + 3, o.w - 6, 5, 3); ctx.fill();
        } else if (o.type === 'spike') {
          ctx.fillStyle = '#ff6b81';
          for (let i = 0; i < o.w / 26; i++) {
            ctx.beginPath(); ctx.moveTo(o.x + i * 26, gy); ctx.lineTo(o.x + i * 26 + 13, gy - o.h); ctx.lineTo(o.x + i * 26 + 26, gy); ctx.closePath(); ctx.fill();
          }
        } else {
          ctx.save(); ctx.shadowColor = '#ff6b81'; ctx.shadowBlur = 12;
          spikePath(ctx, o.x, o.y, 13 * (1 + 0.08 * Math.sin(time * 10)), -time * 2.2);
          ctx.fillStyle = '#ff6b81'; ctx.fill(); ctx.restore();
          ctx.fillStyle = '#3a0f2a'; ctx.beginPath(); ctx.arc(o.x, o.y, 4, 0, 6.283); ctx.fill();
        }
      }
      for (const c of S.coins) {
        ctx.save(); ctx.shadowColor = '#ffd45e'; ctx.shadowBlur = 10;
        starPath(ctx, c.x, c.y, 8, time * 3); ctx.fillStyle = '#fff0a0'; ctx.fill(); ctx.restore();
      }
      const dying = S.mode === 'dying';
      drawChar(px, S.py, S.mode === 'idle' ? time * 2 : S.dist / 16, dying, time);
      drawParts(ctx, S.parts);
      drawPops(ctx, S.pops);
      if (S.mode === 'idle' || (S.mode === 'play' && S.t < 4)) {
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.font = '700 15px ' + FONT; ctx.fillStyle = '#a3aae0';
        ctx.fillText('タップでジャンプ(空中でもう1回とべる)', W / 2, H * 0.34);
        ctx.font = '500 12px ' + FONT;
        ctx.fillText('低くとぶ赤いかけらは、地面にいればよけられる', W / 2, H * 0.34 + 24);
      }
      ctx.restore();
      if (S.flash > 0 && !reduce) { ctx.fillStyle = 'rgba(255,107,129,' + (S.flash * 0.28) + ')'; ctx.fillRect(0, 0, W, H); }
    }

    function setText(key, v) { if (cache[key] !== v) { cache[key] = v; k(key).textContent = v; } }
    function hud() {
      setText('score', String(meters() + S.stars * 10));
      setText('stars', String(S.stars));
      setText('dist', 'きょり ' + meters() + 'm');
    }
    function endGame() {
      S.mode = 'over';
      [523, 440, 349, 262].forEach((f, i) => A.beep(f, 0.25, 'triangle', 0.06, 0, i * 0.14));
      api.end(meters() + S.stars * 10, [['きょり', meters() + 'm'], ['ほし', S.stars], ['ジャンプ', S.jumps]]);
    }

    const onDown = () => jump();
    const onKey = (e) => { if ((e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') && S && S.mode === 'play') { e.preventDefault(); if (!e.repeat) jump(); } };
    stage.addEventListener('pointerdown', onDown);
    window.addEventListener('keydown', onKey);

    function frame(ts) {
      const dt = Math.min(0.05, (ts - last) / 1000 || 0) * DT();
      last = ts;
      if (S.mode === 'play' || S.mode === 'dying') update(dt);
      else if (S.mode === 'idle') S.scroll += 60 * dt;

    if (ro) ro.observe(stage);
    raf = requestAnimationFrame(frame);

    return {
      start() { S = makeState('idle'); Object.keys(cache).forEach((n) => delete cache[n]); buildPicker(); cmsg(''); k('pick').hidden = false; },
      pause() { if (S.mode === 'play') S.mode = 'paused'; },
      resume() { if (S.mode === 'paused') S.mode = 'play'; },
      destroy() { cancelAnimationFrame(raf); if (ro) ro.disconnect(); stage.removeEventListener('pointerdown', onDown); window.removeEventListener('keydown', onKey); }
    };
  }

  /* ===== ゲーム14: リズムタップ ===== */

      <div class="hud">
        <div class="hud-row">
          <div class="score"><span class="lbl">スコア</span><span class="num" data-k="score">0</span></div>
          <div class="score" style="align-items:flex-end"><span class="lbl">せいかく</span><span class="num" style="font-size:24px" data-k="acc">100%</span></div>
        </div>
        <div class="hud-row">
          <span class="chip off" data-k="combo">0 コンボ ×1</span>
          <div class="lv"><span>きょく</span><div class="lv-track"><i data-k="prog"></i></div></div>
        </div>
      </div>`);
    stage.append(root);
    const k = (n) => root.querySelector('[data-k="' + n + '"]');
    const cv = $('canvas', root), ctx = cv.getContext('2d');
    let BPM = 112, BEAT = 60 / BPM, HALF = BEAT / 2, BARS = 21;
    const FALL = 1.5, LANES = 4, T0 = 2.0, TOP = 96;
    const LCOL = ['#ff6b81', '#ffd45e', '#6fe3cf', '#8a62e8'];
    const KEYS = { KeyD: 0, KeyF: 1, KeyJ: 2, KeyK: 3 };
    let W = 360, H = 600, raf = 0, last = 0, S = null;
    const cache = {};
    const hitY = () => H - 110;
    const laneW = () => W / LANES;
    const pop = (x, y, text, c, size) => S.pops.push({ x, y, text, c, size: size || 16, life: 0 });
    const getMult = () => Math.min(4, 1 + Math.floor(S.combo / 10));
    function resize() { const d = fitCanvas(cv, ctx, stage); W = d.W; H = d.H; }

    function applyCfg() {
      const C = window.__rhythmCfg;
      if (C) { BPM = C.bpm; BEAT = 60 / BPM; HALF = BEAT / 2; BARS = Math.max(8, Math.floor(C.len / (BEAT * 4))); }
      else { BPM = 112; BEAT = 60 / BPM; HALF = BEAT / 2; BARS = 21; }
    }
    function makeChart() {
      applyCfg();
      const C = window.__rhythmCfg, off = C ? C.offset : 0, dens = C ? [0.75, 1, 1.2][DIFF] : 1;
      const notes = [];
      for (let bar = 0; bar < BARS; bar++) for (let slot = 0; slot < 8; slot++) {
        const f = bar / BARS, t = T0 + off + (bar * 8 + slot) * HALF, even = slot % 2 === 0;
        const p = (even ? (f < 0.08 ? 0.5 : 0.42 + 0.45 * f) : (f < 0.18 ? 0 : Math.min(0.5, (f - 0.18) * 0.75))) * dens;
        if (Math.random() < Math.min(0.92, p)) {
          const lane = rndInt(0, 3);
          notes.push({ t, lane, done: false });
          if (f > 0.4 && even && Math.random() < 0.12 + 0.1 * f) { const l2 = rndInt(0, 3); if (l2 !== lane) notes.push({ t, lane: l2, done: false }); }
        }
      }
      return notes;
    }
    function makeState(mode) {
      const notes = mode === 'play' ? makeChart() : [];
      const end = notes.length ? notes[notes.length - 1].t + 1.0 : 1;
      return { mode, T: 0, notes, end, nb: 0, score: 0, combo: 0, maxCombo: 0, perfect: 0, great: 0, good: 0, miss: 0, flash: [0, 0, 0, 0], parts: [], pops: [] };
    }

    function tap(lane) {
      if (!S || S.mode !== 'play') return;
      S.flash[lane] = 1;
      let best = null, bd = 1;
      for (const n of S.notes) {
        if (n.t - S.T > 0.3) break;
        if (n.done || n.lane !== lane) continue;
        const d = Math.abs(n.t - S.T);
        if (d < bd) { bd = d; best = n; }
      }
      const cx = laneW() * (lane + 0.5), hy = hitY();
      if (!best || bd > 0.18) { A.beep(200, 0.03, 'sine', 0.02); return; }
      best.done = true; S.combo++;
      if (S.combo > S.maxCombo) S.maxCombo = S.combo;
      let base, label, col;
      if (bd <= 0.06) { base = 30; label = 'パーフェクト!'; col = '#ffd45e'; S.perfect++; }
      else if (bd <= 0.11) { base = 20; label = 'グレート'; col = '#6fe3cf'; S.great++; }
      else { base = 10; label = 'グッド'; col = '#eef0ff'; S.good++; }
      const pts = base * getMult();
      S.score += pts;
      burstTo(S.parts, cx, hy, LCOL[lane], base > 10 ? 10 : 6, 130);
      pop(cx, hy - 40, label, col, 15);
      A.beep(SCALE[lane * 2] , 0.1, 'triangle', 0.07);
    }

    function update(dt) {
      const C = window.__rhythmCfg;
      if (C && !S.free) {
        const rdt = dt / DT();
        if (!S.vstart) { S.T += rdt; if (S.T >= T0) { S.T = T0; S.vstart = true; S.wait = 0; C.begin(); } }
        else {
          const y = C.probe(), want = C.start + (S.T - T0);
          if (y.st === 1 && Math.abs(y.ct - want) < 4) { S.T = T0 + (y.ct - C.start); S.wait = 0; }
          else if (y.st === 0 && S.T > T0 + 5) S.T = S.end + 0.01;
          else { S.wait += rdt; if (S.wait > 15) S.free = true; }
        }
      } else S.T += dt;
      while (S.T >= S.nb * HALF) {
        if (!window.__rhythmCfg) { if (S.nb % 2 === 0) A.beep(110, 0.1, 'sine', 0.09, -50); else A.beep(1800, 0.03, 'triangle', 0.02); }
        S.nb++;
      }
      for (const n of S.notes) {
        if (n.t - S.T > FALL) break;
        if (!n.done && S.T > n.t + 0.18) {
          n.done = true; S.combo = 0; S.miss++;
          pop(laneW() * (n.lane + 0.5), hitY() - 40, 'ミス', '#ff6b81', 15);
        }
      }
      for (let i = 0; i < 4; i++) S.flash[i] = Math.max(0, S.flash[i] - dt * 6);
      stepParts(S.parts, dt); stepPops(S.pops, dt);
      if (S.T > S.end) endGame();
    }

    function draw(time) {
      drawSky(ctx, W, H, time, false);
      const lw = laneW(), hy = hitY(), spd = (hy - TOP) / FALL;
      for (let i = 0; i < LANES; i++) {
        ctx.fillStyle = i % 2 ? 'rgba(160,170,255,0.05)' : 'rgba(160,170,255,0.09)';
        ctx.fillRect(i * lw, TOP - 10, lw, H - TOP + 10);
      }
      ctx.strokeStyle = 'rgba(160,170,255,0.22)'; ctx.lineWidth = 1;
      for (let i = 1; i < LANES; i++) { ctx.beginPath(); ctx.moveTo(i * lw, TOP - 10); ctx.lineTo(i * lw, H); ctx.stroke(); }
      const zr = Math.min(lw * 0.34, 34);
      for (let i = 0; i < LANES; i++) {
        const cx = lw * (i + 0.5), f = S.flash[i];
        if (f > 0) { ctx.fillStyle = LCOL[i]; ctx.globalAlpha = f * 0.45; ctx.beginPath(); ctx.arc(cx, hy, zr * (1 + 0.25 * f), 0, 6.283); ctx.fill(); ctx.globalAlpha = 1; }
        ctx.strokeStyle = LCOL[i]; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(cx, hy, zr, 0, 6.283); ctx.stroke();
      }
      if (S.mode === 'play' || S.mode === 'paused') {
        for (const n of S.notes) {
          if (n.t - S.T > FALL + 0.2) break;
          if (n.done) continue;
          const y = hy - (n.t - S.T) * spd;
          if (y < TOP - 30 || y > H + 30) continue;
          ctx.globalAlpha = clampN((y - TOP) / 60, 0, 1);
          const cx = lw * (n.lane + 0.5);
          ctx.save(); ctx.shadowColor = LCOL[n.lane]; ctx.shadowBlur = 12;
          rrect(ctx, cx - lw * 0.36, y - 11, lw * 0.72, 22, 9); ctx.fillStyle = LCOL[n.lane]; ctx.fill(); ctx.restore();
          rrect(ctx, cx - lw * 0.3, y - 8, lw * 0.6, 5, 3); ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fill();
          ctx.globalAlpha = 1;
        }
      }
      drawParts(ctx, S.parts);
      drawPops(ctx, S.pops);
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const labels = ['D', 'F', 'J', 'K'];
      ctx.font = '700 13px ' + FONT; ctx.fillStyle = 'rgba(163,170,224,0.7)';
      for (let i = 0; i < LANES; i++) ctx.fillText(labels[i], lw * (i + 0.5), hy + zr + 22);
      if (S.mode === 'idle' || (S.mode === 'play' && S.T < 2)) {
        ctx.font = '700 15px ' + FONT; ctx.fillStyle = '#a3aae0';
        ctx.fillText('光る輪にぶつかる瞬間に、そのレーンをタップ', W / 2, H * 0.4);
        ctx.font = '500 12px ' + FONT;
        ctx.fillText('キーボードは D F J K', W / 2, H * 0.4 + 24);
      }
    }

    function setText(key, v) { if (cache[key] !== v) { cache[key] = v; k(key).textContent = v; } }
    function hud() {
      setText('score', String(S.score));
      const hits = S.perfect + S.great + S.good, tot = hits + S.miss;
      setText('acc', (tot ? Math.round(hits / tot * 100) : 100) + '%');
      setText('combo', S.combo + ' コンボ ×' + getMult());
      const sc = S.combo >= 2;
      if (cache.cs !== sc) { cache.cs = sc; k('combo').classList.toggle('off', !sc); }
      const w = clampN(S.T / S.end * 100, 0, 100).toFixed(1) + '%';
      if (cache.w !== w) { cache.w = w; k('prog').style.width = w; }
    }
    function endGame() {
      S.mode = 'over';
      [523, 659, 784, 1047].forEach((f, i) => A.beep(f, 0.18, 'triangle', 0.06, 0, i * 0.08));
      api.end(S.score, [['パーフェクト', S.perfect], ['最大コンボ', S.maxCombo], ['ミス', S.miss]]);
    }

    const onDown = (e) => {
      const r = stage.getBoundingClientRect();
      tap(clampN(Math.floor((e.clientX - r.left) / (r.width / LANES)), 0, LANES - 1));
    };
    const onKey = (e) => { if (e.repeat) return; const l = KEYS[e.code]; if (l != null) tap(l); };
    stage.addEventListener('pointerdown', onDown);
    window.addEventListener('keydown', onKey);

    function frame(ts) {
      const dt = Math.min(0.05, (ts - last) / 1000 || 0) * DT();
      last = ts;
      if (S.mode === 'play') update(dt);
      draw(ts / 1000);
      hud();
      raf = requestAnimationFrame(frame);
    }
    resize();
    S = makeState('idle');
    const ro = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(resize) : null;
    if (ro) ro.observe(stage);
    raf = requestAnimationFrame(frame);

    return {
      start() { S = makeState('play'); Object.keys(cache).forEach((n) => delete cache[n]); },
      pause() { if (S.mode === 'play') S.mode = 'paused'; },
      resume() { if (S.mode === 'paused') S.mode = 'play'; },
      destroy() { cancelAnimationFrame(raf); if (ro) ro.disconnect(); stage.removeEventListener('pointerdown', onDown); window.removeEventListener('keydown', onKey); }
    };
  }

  /* ===== ゲーム15: ライトオフ ===== */
  function createLights(stage, api) {
    const root = el('div', 'pg', `
      <div class="pg-hud">
        <div class="score"><span class="lbl">スコア</span><span class="num" data-k="score">0</span></div>
        <div class="pg-time"><span class="chip" data-k="tm">90秒</span><div class="lv-track wide"><i data-k="tFill" style="width:100%"></i></div></div>
      </div>
      <div class="pg-sub"><span data-k="mv">手数 0 / めやす 3</span><span class="chip" data-k="sz">3×3</span></div>
      <div class="ng-grid" data-k="grid"></div>
      <div class="pg-foot"><span data-k="msg"></span><button class="pill" type="button" data-k="quit">おわる</button></div>`);
    stage.append(root);
    const k = (n) => root.querySelector('[data-k="' + n + '"]');
    const grid = k('grid');
    const TOTAL = 90, TMAX = 120;
    let raf = 0, last = 0, timers = [], phase = 'idle', paused = false, quitArm = 0, curN = 3;
    let time = TOTAL, score = 0, solved = 0, boardNo = 0, moves = 0, totalMoves = 0, par = 3, cells = [];
    const cache = {};
    const later = (fn, ms) => { const id = setTimeout(fn, ms); timers.push(id); return id; };
    const msg = (t) => { k('msg').textContent = t || ''; };
    const sizeFor = (b) => (b < 2 ? 3 : b < 5 ? 4 : 5);

    function flip(i) {
      const n = curN, r = Math.floor(i / n), c = i % n;
      [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]].forEach((d) => {
        const rr = r + d[0], cc = c + d[1];
        if (rr >= 0 && rr < n && cc >= 0 && cc < n) cells[rr * n + cc] = !cells[rr * n + cc];
      });
    }
    function paint() {
      Array.prototype.forEach.call(grid.children, (b, i) => b.classList.toggle('on', !!cells[i]));
    }
    function build(n, active) {
      curN = n; gridSize(root, stage, n);
      const total = n * n;
      const kk = n === 3 ? rndInt(3, 4) : n === 4 ? rndInt(4, 6) : rndInt(6, 9);
      do {
        cells = Array(total).fill(false);
        shuffle(Array.from({ length: total }, (_, i) => i)).slice(0, kk).forEach(flip);
      } while (cells.every((c) => !c));
      par = kk; moves = 0;
      grid.innerHTML = cells.map((c, i) => '<button class="lc' + (c ? ' on' : '') + '" type="button" data-i="' + i + '" aria-label="ライト"' + (active ? '' : ' tabindex="-1"') + '></button>').join('');
    }
    function newBoard() { build(sizeFor(boardNo), true); phase = 'play'; msg(''); }

    function onGrid(e) {
      const b = e.target.closest('.lc[data-i]');
      if (!b || phase !== 'play') return;
      flip(parseInt(b.dataset.i, 10));
      moves++; totalMoves++; paint();
      A.beep(300 + (cells.filter(Boolean).length % 6) * 40, 0.05, 'sine', 0.05);
      if (cells.every((c) => !c)) {
        phase = 'clear'; solved++; boardNo++;
        const pts = 100 + 10 * Math.max(0, par + 2 - moves);
        score += pts; time = Math.min(TMAX, time + 8);
        msg('クリア! +' + pts + '点 ・ +8秒');
        [523, 659, 784, 1047].forEach((f, n) => A.beep(f, 0.16, 'triangle', 0.06, 0, n * 0.07));
        later(newBoard, 800);
      }
    }
    function finish() {
      if (phase === 'over') return;
      phase = 'over';
      [523, 440, 349, 262].forEach((f, i) => A.beep(f, 0.25, 'triangle', 0.06, 0, i * 0.14));
      api.end(score, [['クリア', solved], ['手数', totalMoves], ['最大サイズ', sizeFor(Math.max(0, boardNo)) + '×' + sizeFor(Math.max(0, boardNo))]]);
    }
    function setText(key, v) { if (cache[key] !== v) { cache[key] = v; k(key).textContent = v; } }
    function hud() {
      setText('score', String(score));
      setText('tm', Math.max(0, Math.ceil(time)) + '秒');
      const w = clampN(time / TOTAL * 100, 0, 100).toFixed(1) + '%';
      if (cache.w !== w) { cache.w = w; k('tFill').style.width = w; }
      setText('mv', phase === 'idle' ? '全部のライトを消そう' : '手数 ' + moves + ' / めやす ' + par);
      setText('sz', curN + '×' + curN);
    }
    function frame(ts) {
      const dt = Math.min(0.05, (ts - last) / 1000 || 0) * DT();
      last = ts;
      if ((phase === 'play' || phase === 'clear') && !paused) { time -= dt; if (time <= 0) { time = 0; finish(); } }
      hud();
      raf = requestAnimationFrame(frame);
    }
    const onQuit = () => {
      if (phase === 'over' || phase === 'idle') return;
      if (!quitArm) {
        k('quit').textContent = '本当におわる?';
        quitArm = setTimeout(() => { quitArm = 0; k('quit').textContent = 'おわる'; }, 2500);
        timers.push(quitArm);
      } else { clearTimeout(quitArm); quitArm = 0; k('quit').textContent = 'おわる'; finish(); }
    };
    grid.addEventListener('click', onGrid);
    k('quit').addEventListener('click', onQuit);
    build(3, false);
    const ro = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(() => gridSize(root, stage, curN)) : null;
    if (ro) ro.observe(stage);
    raf = requestAnimationFrame(frame);

    return {
      start() {
        timers.forEach(clearTimeout); timers = [];
        time = TOTAL; score = 0; solved = 0; boardNo = 0; totalMoves = 0; paused = false; quitArm = 0;
        k('quit').textContent = 'おわる';
        Object.keys(cache).forEach((n) => delete cache[n]);
        newBoard();
      },
      pause() { paused = true; },
      resume() { paused = false; },
      destroy() { cancelAnimationFrame(raf); timers.forEach(clearTimeout); if (ro) ro.disconnect(); grid.removeEventListener('click', onGrid); }
    };
  }

  /* ===== ゲーム16: ちがうのどれ ===== */
  function createOdd(stage, api) {
    const root = el('div', 'pg', `
      <div class="pg-hud">
        <div class="score"><span class="lbl">スコア</span><span class="num" data-k="score">0</span></div>
        <div class="pg-time"><span class="chip" data-k="tm">45秒</span><div class="lv-track wide"><i data-k="tFill" style="width:100%"></i></div></div>
      </div>
      <div class="pg-sub"><span data-k="lv">レベル 1</span><span class="chip off" data-k="combo">0 コンボ ×1</span></div>
      <div class="ng-grid" data-k="grid"></div>
      <div class="pg-foot"><span data-k="msg"></span><button class="pill" type="button" data-k="quit">おわる</button></div>`);
    stage.append(root);
    const k = (n) => root.querySelector('[data-k="' + n + '"]');
    const grid = k('grid');
    const TOTAL = 45;
    let raf = 0, last = 0, timers = [], phase = 'idle', paused = false, quitArm = 0, curN = 2, qStart = 0;
    let time = TOTAL, score = 0, combo = 0, maxCombo = 0, level = 0, correct = 0, oddIdx = 0;
    const cache = {};
    const later = (fn, ms) => { const id = setTimeout(fn, ms); timers.push(id); return id; };
    const mult = () => Math.min(5, 1 + Math.floor(combo / 4));
    const msg = (t) => { k('msg').textContent = t || ''; };
    const nFor = (L) => (L < 2 ? 2 : L < 5 ? 3 : L < 9 ? 4 : L < 14 ? 5 : L < 20 ? 6 : 7);

    function build(L, active) {
      const n = nFor(L); curN = n; gridSize(root, stage, n);
      const dl = Math.max(2.4, 16 - L * 0.9);
      const h = rndInt(0, 359), s = 58 + rndInt(0, 12), l = 45 + rndInt(0, 12);
      const sign = l + dl > 78 ? -1 : (l - dl < 28 ? 1 : (Math.random() < 0.5 ? -1 : 1));
      oddIdx = rndInt(0, n * n - 1);
      let html = '';
      for (let i = 0; i < n * n; i++) {
        const li = i === oddIdx ? l + sign * dl : l;
        html += '<button class="oc" type="button" data-i="' + i + '" aria-label="マス" style="background:hsl(' + h + ',' + s + '%,' + li.toFixed(1) + '%)"' + (active ? '' : ' tabindex="-1"') + '></button>';
      }
      grid.innerHTML = html;
      qStart = performance.now();
    }
    function onGrid(e) {
      const b = e.target.closest('.oc[data-i]');
      if (!b || phase !== 'play') return;
      const i = parseInt(b.dataset.i, 10);
      if (i === oddIdx) {
        const fast = (performance.now() - qStart) / 1000 <= 1.5;
        combo++; if (combo > maxCombo) maxCombo = combo;
        const pts = 10 * mult() + (fast ? 5 : 0);
        score += pts; correct++; level++;
        msg('+' + pts + (fast ? ' 速い!' : ''));
        A.beep(SCALE[combo % 8], 0.1, 'sine', 0.06);
        build(level, true);
      } else {
        combo = 0; time -= 3;
        b.classList.remove('bad'); void b.offsetWidth; b.classList.add('bad');
        grid.children[oddIdx].classList.add('hint');
        msg('-3秒');
        A.beep(170, 0.2, 'sawtooth', 0.06, -90);
        phase = 'wait';
        later(() => { if (phase === 'wait') { phase = 'play'; build(level, true); } }, 600);
      }
    }
    function finish() {
      if (phase === 'over') return;
      phase = 'over';
      [523, 440, 349, 262].forEach((f, i) => A.beep(f, 0.25, 'triangle', 0.06, 0, i * 0.14));
      api.end(score, [['せいかい', correct], ['最大コンボ', maxCombo], ['レベル', level + 1]]);
    }
    function setText(key, v) { if (cache[key] !== v) { cache[key] = v; k(key).textContent = v; } }
    function hud() {
      setText('score', String(score));
      setText('tm', Math.max(0, Math.ceil(time)) + '秒');
      const w = clampN(time / TOTAL * 100, 0, 100).toFixed(1) + '%';
      if (cache.w !== w) { cache.w = w; k('tFill').style.width = w; }
      setText('lv', phase === 'idle' ? '1つだけ色がちがうマスを探そう' : 'レベル ' + (level + 1));
      setText('combo', combo + ' コンボ ×' + mult());
      const sc = combo >= 2;
      if (cache.cs !== sc) { cache.cs = sc; k('combo').classList.toggle('off', !sc); }
    }
    function frame(ts) {
      const dt = Math.min(0.05, (ts - last) / 1000 || 0) * DT();
      last = ts;
      if ((phase === 'play' || phase === 'wait') && !paused) { time -= dt; if (time <= 0) { time = 0; finish(); } }
      hud();
      raf = requestAnimationFrame(frame);
    }
    const onQuit = () => {
      if (phase === 'over' || phase === 'idle') return;
      if (!quitArm) {
        k('quit').textContent = '本当におわる?';
        quitArm = setTimeout(() => { quitArm = 0; k('quit').textContent = 'おわる'; }, 2500);
        timers.push(quitArm);
      } else { clearTimeout(quitArm); quitArm = 0; k('quit').textContent = 'おわる'; finish(); }
    };
    grid.addEventListener('click', onGrid);
    k('quit').addEventListener('click', onQuit);
    build(2, false);
    const ro = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(() => gridSize(root, stage, curN)) : null;
    if (ro) ro.observe(stage);
    raf = requestAnimationFrame(frame);

    return {
      start() {
        timers.forEach(clearTimeout); timers = [];
        time = TOTAL; score = 0; combo = 0; maxCombo = 0; level = 0; correct = 0; paused = false; quitArm = 0;
        k('quit').textContent = 'おわる'; msg('');
        Object.keys(cache).forEach((n) => delete cache[n]);
        phase = 'play'; build(0, true);
      },
      pause() { paused = true; },
      resume() { paused = false; },
      destroy() { cancelAnimationFrame(raf); timers.forEach(clearTimeout); if (ro) ro.disconnect(); grid.removeEventListener('click', onGrid); }

  /* ===== ゲーム17: もぐらたたき ===== */
  function createMole(stage, api) {
    const root = el('div', 'pg', `
      <div class="pg-hud">

      <div class="ng-grid" data-k="grid"></div>
      <div class="pg-foot"><span data-k="msg"></span><button class="pill" type="button" data-k="quit">おわる</button></div>`);
    stage.append(root);
    const k = (n) => root.querySelector('[data-k="' + n + '"]');
    const grid = k('grid');
    const TOTAL = 40, EMO = { mole: '🐹', gold: '⭐', bomb: '💣' };
    let raf = 0, last = 0, timers = [], phase = 'idle', paused = false, quitArm = 0;
    let time = TOTAL, elapsed = 0, spawnLeft = 0.6, score = 0, combo = 0, maxCombo = 0, hits = 0, golds = 0, bombs = 0, missed = 0;
    const holes = Array.from({ length: 9 }, () => ({ kind: '', left: 0 }));
    const cache = {};
    const later = (fn, ms) => { const id = setTimeout(fn, ms); timers.push(id); return id; };
    const msg = (t) => { k('msg').textContent = t || ''; };
    const mult = () => Math.min(5, 1 + Math.floor(combo / 5));
    grid.innerHTML = holes.map((h, i) => '<button class="mc" type="button" data-i="' + i + '" aria-label="あな"><span></span></button>').join('');
    const cells = Array.from(grid.children);
    function paint(i) {
      const h = holes[i], c = cells[i];
      c.classList.toggle('up', !!h.kind);
      c.classList.toggle('gold', h.kind === 'gold');
      c.classList.toggle('bomb', h.kind === 'bomb');
      if (h.kind) c.firstChild.textContent = EMO[h.kind];
    }
    function flash(i, cls) { cells[i].classList.add(cls); later(() => cells[i].classList.remove(cls), 220); }
    function clearHole(i) { holes[i].kind = ''; paint(i); }
    function spawn() {
      const free = [];
      holes.forEach((h, i) => { if (!h.kind) free.push(i); });
      if (!free.length) return;
      const i = free[rndInt(0, free.length - 1)], r = Math.random();
      const bombP = elapsed < 6 ? 0 : 0.18;
      holes[i].kind = r < bombP ? 'bomb' : r < bombP + 0.08 ? 'gold' : 'mole';
      holes[i].left = Math.max(0.55, 1.25 - elapsed * 0.014);
      paint(i);
      if (elapsed > 14 && Math.random() < 0.3) spawn();
    }
    function onGrid(e) {
      const b = e.target.closest('.mc[data-i]');
      if (!b || phase !== 'play' || paused) return;
      const i = parseInt(b.dataset.i, 10), h = holes[i];
      if (!h.kind) return;
      if (h.kind === 'bomb') {
        bombs++; combo = 0; score = Math.max(0, score - 20); time = Math.max(0, time - 2);
        msg('ばくはつ! -20点 ・ -2秒'); flash(i, 'boom');
        A.beep(150, 0.25, 'sawtooth', 0.07, -80);
      } else {
        combo++; if (combo > maxCombo) maxCombo = combo; hits++;
        const base = h.kind === 'gold' ? 30 : 10;
        if (h.kind === 'gold') golds++;
        const pts = base * mult(); score += pts;
        msg('+' + pts + (h.kind === 'gold' ? ' 金!' : '')); flash(i, 'hit');
        A.beep(SCALE[combo % 8], 0.08, 'sine', 0.06);
      }
      clearHole(i);
    }
    function finish() {
      if (phase === 'over') return;
      phase = 'over';
      holes.forEach((h, i) => clearHole(i));
      [523, 440, 349, 262].forEach((f, i) => A.beep(f, 0.25, 'triangle', 0.06, 0, i * 0.14));
      api.end(score, [['たたいた', hits], ['金', golds], ['最大コンボ', maxCombo], ['にげられた', missed]]);
    }
    function setText(key, v) { if (cache[key] !== v) { cache[key] = v; k(key).textContent = v; } }
    function hud() {
      setText('score', String(score));
      setText('tm', Math.max(0, Math.ceil(time)) + '秒');
      const w = clampN(time / TOTAL * 100, 0, 100).toFixed(1) + '%';
      if (cache.w !== w) { cache.w = w; k('tFill').style.width = w; }
      setText('combo', combo + ' コンボ ×' + mult());
      const sc = combo >= 2;
      if (cache.cs !== sc) { cache.cs = sc; k('combo').classList.toggle('off', !sc); }
    }
    function frame(ts) {
      const dt = Math.min(0.05, (ts - last) / 1000 || 0) * DT();
      last = ts;
      if (phase === 'play' && !paused) {
        time -= dt; elapsed += dt; spawnLeft -= dt;
        if (spawnLeft <= 0) { spawn(); spawnLeft = Math.max(0.32, 0.85 - elapsed * 0.012) * (0.75 + Math.random() * 0.5); }
        holes.forEach((h, i) => {
          if (!h.kind) return;
          h.left -= dt;
          if (h.left <= 0) { if (h.kind !== 'bomb') { combo = 0; missed++; } clearHole(i); }
        });
        if (time <= 0) { time = 0; finish(); }
      }
      hud();
      raf = requestAnimationFrame(frame);
    }
    const onQuit = () => {
      if (phase === 'over' || phase === 'idle') return;
      if (!quitArm) {
        k('quit').textContent = '本当におわる?';
        quitArm = setTimeout(() => { quitArm = 0; k('quit').textContent = 'おわる'; }, 2500);
        timers.push(quitArm);
      } else { clearTimeout(quitArm); quitArm = 0; k('quit').textContent = 'おわる'; finish(); }
    };
    grid.addEventListener('click', onGrid);
    k('quit').addEventListener('click', onQuit);
    gridSize(root, stage, 3);
    const ro = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(() => gridSize(root, stage, 3)) : null;
    if (ro) ro.observe(stage);
    raf = requestAnimationFrame(frame);

    return {
      start() {
        timers.forEach(clearTimeout); timers = [];
        time = TOTAL; elapsed = 0; spawnLeft = 0.6; score = 0; combo = 0; maxCombo = 0; hits = 0; golds = 0; bombs = 0; missed = 0; paused = false; quitArm = 0;
        holes.forEach((h, i) => clearHole(i));
        k('quit').textContent = 'おわる'; msg('');
        Object.keys(cache).forEach((n) => delete cache[n]);
        phase = 'play';
      },
      pause() { paused = true; },
      resume() { paused = false; },
      destroy() { cancelAnimationFrame(raf); timers.forEach(clearTimeout); if (ro) ro.disconnect(); grid.removeEventListener('click', onGrid); }
    };
  }

  /* ===== ゲーム18: はんのうテスト ===== */
  function createReflex(stage, api) {
    const root = el('div', 'rx', `
      <div class="pg-hud">
        <div class="score"><span class="lbl">スコア</span><span class="num" data-k="score">0</span></div>
        <span class="chip" data-k="rd">1 / 5</span>
      </div>
      <button class="rx-pad idle" type="button" data-k="pad"><span class="rx-t" data-k="t">はじめよう</span><span class="rx-s" data-k="s"></span></button>
      <div class="rx-hist" data-k="hist"></div>
      <div class="pg-foot rx-foot"><span data-k="msg"></span><button class="pill" type="button" data-k="quit">おわる</button></div>`);
    stage.append(root);
    const k = (n) => root.querySelector('[data-k="' + n + '"]');
    const pad = k('pad'), ROUNDS = 5;
    let raf = 0, last = 0, timers = [], phase = 'idle', paused = false, quitArm = 0;
    let round = 0, score = 0, waitLeft = 0, goAt = 0, pausedAt = 0, times = [], early = 0;
    const later = (fn, ms) => { const id = setTimeout(fn, ms); timers.push(id); return id; };
    const setPad = (cls, t, s) => { pad.className = 'rx-pad ' + cls; k('t').textContent = t; k('s').textContent = s || ''; };
    const histPush = (txt, cls) => { const c = el('span', 'chip ' + (cls || '')); c.textContent = txt; k('hist').append(c); };
    function beginRound() {
      if (round >= ROUNDS) { finish(); return; }
      k('rd').textContent = (round + 1) + ' / ' + ROUNDS;
      phase = 'wait'; waitLeft = Math.max(0.6, (1.2 + Math.random() * 2.2) * (1 - 0.13 * round));
      setPad('wait', 'まって…', '緑になったらタップ');
    }
    function endRound(txt, cls) {
      histPush(txt, cls); round++; phase = 'between';
      k('rd').textContent = Math.min(round + 1, ROUNDS) + ' / ' + ROUNDS;
      later(beginRound, 1100);
    }
    function tap() {
      if (paused) return;
      if (phase === 'wait') {
        early++; setPad('idle', 'はやすぎ!', '0点'); A.beep(160, 0.2, 'sawtooth', 0.06, -80);
        endRound('はやい', 'off2');
      } else if (phase === 'go') {
        const ms = Math.round(performance.now() - goAt);
        const pts = clampN(Math.round((450 - ms) / 3), 0, 100);
        score += pts; times.push(ms);
        setPad('idle', ms + ' ミリ秒', '+' + pts + '点');
        A.beep(SCALE[Math.min(7, Math.floor(pts / 14))], 0.12, 'sine', 0.07);
        endRound(ms + 'ms');
      } else if (phase === 'idle') {
        /* まだ開始前 */
      }
    }
    function finish() {
      if (phase === 'over') return;
      phase = 'over';
      [523, 440, 349, 262].forEach((f, i) => A.beep(f, 0.25, 'triangle', 0.06, 0, i * 0.14));
      const best = times.length ? Math.min.apply(null, times) : 0;
      const avg = times.length ? Math.round(times.reduce((a, b) => a + b, 0) / times.length) : 0;
      api.end(score, [['いちばん速い(ms)', best], ['へいきん(ms)', avg], ['はやすぎ', early]]);
    }
    function frame(ts) {
      const dt = Math.min(0.05, (ts - last) / 1000 || 0) * DT();
      last = ts;
      if (phase === 'wait' && !paused) {
        waitLeft -= dt;
        if (waitLeft <= 0) { phase = 'go'; goAt = performance.now(); setPad('go', 'いま!', 'タップ!'); A.beep(880, 0.06, 'square', 0.04); }
      }
      k('score').textContent = String(score);
      raf = requestAnimationFrame(frame);
    }
    const onDown = (e) => { e.preventDefault(); tap(); };
    const onKey = (e) => { if ((e.code === 'Space' || e.code === 'Enter') && (phase === 'wait' || phase === 'go')) { e.preventDefault(); tap(); } };
    const onQuit = () => {
      if (phase === 'over' || phase === 'idle') return;
      if (!quitArm) {
        k('quit').textContent = '本当におわる?';
        quitArm = setTimeout(() => { quitArm = 0; k('quit').textContent = 'おわる'; }, 2500);
        timers.push(quitArm);
      } else { clearTimeout(quitArm); quitArm = 0; k('quit').textContent = 'おわる'; finish(); }
    };
    pad.addEventListener('pointerdown', onDown);
    window.addEventListener('keydown', onKey);
    k('quit').addEventListener('click', onQuit);
    raf = requestAnimationFrame(frame);

    return {
      start() {
        timers.forEach(clearTimeout); timers = [];
        round = 0; score = 0; times = []; early = 0; paused = false; quitArm = 0;
        k('hist').textContent = ''; k('quit').textContent = 'おわる'; k('msg').textContent = '';
        beginRound();
      },
      pause() { paused = true; pausedAt = performance.now(); },
      resume() { paused = false; if (phase === 'go') goAt += performance.now() - pausedAt; },
      destroy() { cancelAnimationFrame(raf); timers.forEach(clearTimeout); pad.removeEventListener('pointerdown', onDown); window.removeEventListener('keydown', onKey); }
    };
  }

  /* ===== ゲーム19: じゃんけんチャレンジ ===== */
  const HANDS = ['✊\nグー', '✌️\nチョキ', '🖐️\nパー'];
  function rpsNext(ctx) {
    const f = rndInt(0, 2);
    const mode = ctx.n < 5 ? 'win' : ctx.n < 10 ? (Math.floor(ctx.n / 5) % 2 ? 'lose' : 'win') : ['win', 'lose', 'draw'][rndInt(0, 2)];
    const target = mode === 'win' ? (f + 2) % 3 : mode === 'lose' ? (f + 1) % 3 : f;
    const tag = mode === 'win' ? '<span class="tag t-ink">かつ手をえらぶ</span>' : mode === 'lose' ? '<span class="tag t-read">まける手をえらぶ</span>' : '<span class="tag t-draw">あいこの手をえらぶ</span>';
    return { html: tag + '<div class="sub">あいては</div><div class="big" style="font-size:40px">' + HANDS[f].replace('\n', ' ') + '</div>', opts: HANDS.slice(), ans: target };
  }
  const createRps = (stage, api) => createQuiz(stage, api, {
    total: 40, penalty: 2, quick: 1.0, next: rpsNext,

  /* ===== ゲーム20: どっちがおおきい ===== */
  function cmpExpr(lv) {
    if (lv === 0) { const v = rndInt(10, 99); return { t: String(v), v: v }; }
    if (lv === 1) { const a = rndInt(10, 50), b = rndInt(5, 40); return { t: a + ' + ' + b, v: a + b }; }
    if (lv === 2) { const a = rndInt(3, 12), b = rndInt(3, 12); return Math.random() < 0.5 ? { t: a + ' × ' + b, v: a * b } : { t: (a * 4) + ' + ' + b, v: a * 4 + b }; }
    const a = rndInt(3, 12), b = rndInt(3, 9), c = rndInt(2, 30);
    return Math.random() < 0.5 ? { t: a + ' × ' + b + ' + ' + c, v: a * b + c } : { t: (a + b) + ' × ' + rndInt(3, 9), v: 0 };
  }
  function cmpPair(lv) {
    const lim = [25, 18, 12, 8][lv];
    for (let tries = 0; tries < 40; tries++) {
      const a = cmpExpr(lv), b = cmpExpr(lv);
      if (!a.v || !b.v) { /* 乗算を含む式は値を計算し直す */ }
      const va = a.v || eval1(a.t), vb = b.v || eval1(b.t);
      if (va !== vb && Math.abs(va - vb) <= lim) return { a: a.t, b: b.t, va: va, vb: vb };
    }
    const x = rndInt(20, 60);
    return { a: String(x), b: String(x + 3), va: x, vb: x + 3 };
  }
  function eval1(t) { const m = /^(\d+) × (\d+)$/.exec(t); return m ? (+m[1]) * (+m[2]) : 0; }
  function cmpNext(ctx) {

      intro: 'バラバラに並んだ数字を、1から順番にタッチしていきます。全部タッチすると、次はマスが増えます。',
      how: ['小さい数字から順にタップ。制限時間は60秒', 'まちがえると -2秒。つづけて正解すると倍率アップ', '盤面を全部タッチすると +3秒とボーナス'], legend: '' },
    { id: 'color', name: 'いろあて', short: 'いろあて', desc: '文字の色か読みを、ルールに合わせて選ぶ。', icon: ICON_COLOR, create: createColor,
      intro: '色の名前が、ちがう色で書かれて出てきます。上に出るルールに合わせて、正しい色の名前を選びます。',
      how: ['「もじのいろ」なら、文字のインクの色を答える', '「もじをよむ」なら、書かれている文字を答える', 'ルールは6問ごとに切りかわる。まちがえると -2秒'], legend: '' },
    { id: 'runner', name: 'ほしランナー', short: 'ランナー', desc: '星のこが走る。ジャンプでよけて星を集める。', icon: ICON_RUN, create: createRunner,
      intro: '走りつづける星のこを、ジャンプで操作します。障害物をよけながら、星を集めて遠くまで進みましょう。',
      how: ['画面をタップ、スペースキーでジャンプ。空中でもう1回とべる', '紫の岩と赤いトゲは、ジャンプでこえる', '低くとぶ赤いかけらは、地面にいればぶつからない。ジャンプすると当たる'], legend: '' },
    { id: 'rhythm', name: 'リズムタップ', short: 'リズム', desc: '落ちてくる光を、リズムに合わせてタップ。', icon: ICON_RHYTHM, create: (stage, api) => withBgm(createRhythm, stage, api),
      intro: '4つのレーンを光が落ちてきます。下の輪にぶつかる瞬間にタップしましょう。曲は約45秒です(YouTubeのBGMを入れたときは、その曲に合わせた長さになります)。',
      how: ['光が輪に重なる瞬間に、そのレーンをタップ(キーは D F J K)', 'ぴったりなほど高得点。つづけて決めると倍率アップ', 'タップしないで通りすぎるとミス。音が出るのでイヤホンがおすすめ'], legend: '<div class="ytbox"><span>BGM(おまけ): YouTubeのURLをはると、その曲に合わせて遊べます</span><input id="ytUrl" type="url" inputmode="url" placeholder="https://www.youtube.com/watch?v=…" autocomplete="off"><div class="ytrow"><label>はじまり(秒)<input id="ytStart" type="number" min="0" max="3600" step="1" placeholder="0"></label><label>あそぶ長さ<select id="ytLen"><option value="0">曲の最後まで</option><option value="120">約2分</option><option value="90">約1分30秒</option><option value="60">約1分</option><option value="45">約45秒</option><option value="30">約30秒</option></select></label></div><div class="ytrow"><label>曲のBPM<input id="ytBpm" type="number" min="60" max="200" placeholder="120"></label><label>ずれ(秒)<input id="ytOff" type="number" min="-1" max="1" step="0.05" placeholder="0"></label></div><span class="note">曲は自動では解析できません。サビから遊ぶときは「はじまり」にサビの頭の秒数を、「あそぶ長さ」に ワンサビぶんの長さを入れてください。BPM を入れると、音符の間隔が曲に近づきます。タイミングが合わないときは「ずれ」で調整できます。</span></div>' },
    { id: 'lights', name: 'ライトオフ', short: 'ライトオフ', desc: 'ライトを全部消す。押すと上下左右も切りかわる。', icon: ICON_LIGHTS, create: createLights,
      intro: 'ライトを押すと、そのライトと上下左右のライトが切りかわります。全部消せばクリアです。',
      how: ['光っているライトをすべて消す', '少ない手数でクリアするほど高得点(めやすの手数が出ます)', 'クリアすると +8秒。盤面は3×3から5×5まで大きくなる。制限時間は90秒'], legend: '' },
    { id: 'odd', name: 'ちがうのどれ', short: 'ちがう', desc: '1つだけ色がちがうマスを探す。', icon: ICON_ODD, create: createOdd,
      intro: 'たくさんのマスの中から、1つだけ色がちがうマスを探します。進むほど、マスは増えて色の差は小さくなります。',
      how: ['色がちがうマスをタップ', '1.5秒いないに見つけると +5点', 'まちがえると -3秒(答えが一瞬光ります)。制限時間は45秒'], legend: '' },
    { id: 'mole', name: 'もぐらたたき', short: 'もぐら', desc: '出てきたもぐらをたたく。爆弾はさわらない。', icon: ICON_MOLE, create: createMole,
      intro: '9つのあなから、もぐらが顔を出します。すばやくタップ。爆弾と金のもぐらにも注意です。',
      how: ['もぐら🐹は +10点、金のもぐら⭐は +30点', 'つづけてたたくとコンボで倍率アップ(最大×5)', '爆弾💣をたたくと -20点・-2秒。制限時間は40秒'], legend: '' },
    { id: 'reflex', name: 'はんのうテスト', short: 'はんのう', desc: '緑になった瞬間にタップ。反応の速さをきそう。', icon: ICON_REFLEX, create: createReflex,
      intro: '画面が赤から緑に変わったら、すぐにタップ。全5回で、反応の速さを点数にします。',
      how: ['赤の間は待つ。緑になったらすぐタップ(スペースキーでもOK)', '速いほど高得点(1回100点まで)', '緑になる前にタップするとその回は0点'], legend: '' },
    { id: 'rps', name: 'じゃんけん', short: 'じゃんけん', desc: '指定どおりの手を、すばやく出す。', icon: ICON_RPS, create: createRps,
      intro: 'あいての手を見て、「勝つ手」「負ける手」「あいこの手」を出します。頭の切りかえが大事です。',
      how: ['上に出るルールに合う手をタップ(1〜3キーでも選べます)', '1秒いないに答えると +5点', 'まちがえると -2秒。制限時間は40秒'], legend: '' },
    { id: 'trivia', name: 'ものしりクイズ', short: 'クイズ', desc: '理科・歴史・言葉など、いろいろな4択クイズ。', icon: ICON_TRIVIA, create: createTrivia,
      intro: '理科・地理・歴史・ことわざ・スポーツなど、ジャンルいろいろの4択クイズ。進むほどむずかしくなります。',
      how: ['答えをタップ(1〜4キーでも選べます)', '4秒いないに答えると +5点。連続せいかいでコンボ倍率アップ', 'まちがえると -4秒。むずかしい問題は後半に出ます'], legend: '' },
    { id: 'slide', name: 'スライド', short: 'スライド', desc: '数字を1から順にならべるパズル。', icon: ICON_SLIDE, create: createSlide,
      intro: 'マスをスライドさせて、数字を1から順にならべます。空いているマスに向かって、同じ列のマスをまとめて動かせます。',
      how: ['動かしたいマスをタップ(空きと同じ行か列なら、まとめて動く)', '速くそろえるほど高得点。クリアで +10秒', '3×3から始まり、3問目からは4×4。制限時間は90秒'], legend: '' },
    { id: 'hilo', name: 'ハイ&ロー', short: 'ハイロー', th: 'felt', desc: 'トランプで、次のカードが高いか低いかを当てる。', icon: ICON_HILO, create: createHilo,
      intro: '今のカード(1〜13)より、次のカードが高いか低いかを当てます。連続で当てるほど倍率アップです。',
      how: ['「高い」か「低い」をタップ(1・2キーでも選べます)', '1.2秒いないに答えると +5点', 'はずれると -3秒。制限時間は40秒'], legend: '' },
    { id: 'dodge', name: 'ほしよけ', short: 'ほしよけ', desc: '降ってくる岩をよけて、星を集める。', icon: ICON_DODGE, create: createDodge,
      intro: '画面の下の船を左右に動かして、降ってくる岩をよけます。星を取ると高得点です。',
      how: ['指やマウスで船を動かす(キーボードは ← → か A D)', '星は +30点。生きた時間もスコアになる', 'ライフは3つ。当たると1秒だけ無敵になる'], legend: '' },
    { id: 'mash', name: 'れんだチャレンジ', short: 'れんだ', desc: '12秒間、とにかくタップしまくる。', icon: ICON_MASH, create: createMash,
      intro: '12秒間、画面をできるだけたくさんタップします。ボーナスの時間は、1回が3点になります。',
      how: ['大きなボタンをタップ(スペースキーでもOK)', '3〜5秒と7〜9秒は ×3 のボーナスタイム(ボタンが緑になる)', '指を痛めないように、ほどほどに'], legend: '' },
    { id: 'nmem', name: 'ナンバー記憶', short: '記憶', desc: '一瞬だけ見える数字を、同じ順に入れる。', icon: ICON_NMEM, create: createNumMem,
      intro: '数字が一瞬だけ表示されます。消えたら、同じ数字を同じ順に入力しましょう。成功するたびに、けた数が増えます。',
      how: ['数字をおぼえて、キーパッドで入力(キーボードの数字キーもOK)', '成功すると1けた増える。点数はけた数が多いほど高い', 'ライフは3つ。まちがえると少し簡単になる'], legend: '' },
    { id: 'stack', name: 'つみあげ', short: 'つみあげ', desc: '動くブロックを重ねて、できるだけ高く積む。', icon: ICON_STACK, create: createStack,
      intro: '左右に動くブロックを、タップで落として積み上げます。ずれた部分は切り落とされて、だんだん細くなります。',
      how: ['タイミングよくタップ(スペースキーでもOK)', 'ほぼぴったりなら、切り落とされずボーナス', '完全に外すと終わり。高く積むほどスピードアップ'], legend: '' },
    { id: 'bj', name: 'ブラックジャック', short: 'BJ', th: 'felt', desc: 'ディーラーと勝負。21に近づけよう。', icon: ICON_BJ, create: createBlackjack,
      intro: 'カードの合計を21に近づける、トランプの定番ゲーム。10ハンドのあいだに、チップをどれだけ増やせるかを競います。',
      how: ['最初に100チップ。ハンドごとに 10・20・50 からかける', 'ヒットで1枚引く、スタンドでやめる。21をこえるとバスト(負け)', 'ブラックジャック(最初の2枚で21)は 1.5倍。最後のチップ数がスコア'], legend: '' },
    { id: 'poker', name: 'ビデオポーカー', short: 'ポーカー', th: 'felt', desc: '5枚のカードで役をそろえる、1人用ポーカー。', icon: ICON_POKER, create: createPoker,
      intro: '配られた5枚から、のこすカードを選んで、1回だけ引き直せます。できた役に応じて、チップがもらえます。',
      how: ['最初に100チップ。1ハンド 10チップ。全部で12ハンド', 'のこしたいカードをタップ(キープ)してから、ドロー', 'ジャックス以上のペアから配当あり。ロイヤルフラッシュは ×250'], legend: '' },
    { id: 'maid', name: 'ババ抜き', short: 'ババ抜き', th: 'felt', desc: 'ハルとミナとババ抜き。負けるまで続く。', icon: ICON_MAID, create: createMaid,
      intro: '3人でババ抜き。あいての手札から1枚引いて、同じ数字がそろったら捨てます。最後までババ(JOKER)をもっていたら負けです。',
      how: ['あいての伏せたカードをタップして、1枚引く', '同じ数字のペアは自動で捨てられる', '1位で上がると +120、2位で +60。ババが残ると終わり'], legend: '' },
    { id: 'reversi', name: 'リバーシ', short: 'リバーシ', th: 'wood', desc: 'コンピュータと黒白の陣取り勝負。', icon: ICON_REVERSI, create: createReversi,
      intro: '8×8の盤で、あいてのコマをはさんでひっくり返します。最後に石が多いほうの勝ちです。あなたは黒で先手です。',
      how: ['光っているマスをタップしておく', 'あいての石を、自分の石ではさむとひっくり返せる', '石×5点 + 勝つと +100点。むずかしさで、あいての強さが変わる'], legend: '' },
    { id: 'c4', name: 'よつめならべ', short: 'よつめ', th: 'sky', desc: '縦・横・ななめに4つそろえる。', icon: ICON_C4, create: createConnect4,
      intro: '列をえらんで玉を落とし、縦・横・ななめのどれかに4つ並べたら勝ち。勝つたびに、あいてが強くなります。',
      how: ['落としたい列をタップ(赤があなた)', '早く勝つほど高得点。引き分けは +30', '負けるまで続く。むずかしさで最初の強さが変わる'], legend: '' },
    { id: 'mines', name: 'マインスイーパー', short: '地雷', th: 'paper', desc: '数字をヒントに、地雷をさけてマスを開く。', icon: ICON_MINES, create: createMines,
      intro: 'マスを開いて、地雷をさけます。数字は、まわりの8マスにある地雷の数です。地雷以外を全部開けばクリアです。',
      how: ['タップでマスを開く。「旗モード」で地雷のめじるしをおく', '数字のまわりの旗の数が合っていれば、数字をタップでまわりをまとめて開ける', '早くクリアするほど高得点。盤面は少しずつ大きくなる。地雷を開くと終わり'], legend: '' },
    { id: 'sevens', name: '七ならべ', short: '七ならべ', th: 'felt', desc: '7から数をつなげて、先に手札をなくす。', icon: ICON_SEVENS, create: createSevens,
      intro: '3人のコンピュータと七ならべ。7をつなげるように、同じマークで1つとなりの数を出していきます。手札を早くなくした人の勝ちです。',
      how: ['光っているカード(出せるカード)をタップ', '出せないときは「パス」。パスは3回まで、4回目で脱落', '1位 +150、2位 +100、3位 +50。のこりパス1回につき +10'], legend: '' },
    { id: 'mahjong', name: '麻雀', short: '麻雀', th: 'felt', desc: 'CPU3人と東1局だけ打つ、かんたん麻雀。', icon: ICON_MAHJONG, create: createMahjong,
      intro: '3人のコンピュータと打つ、かんたんルールの麻雀です。1局(東1局)だけで勝負が決まります。鳴き(チー・ポン)はなし。手牌13枚に1枚ひいて、1枚すてて、4つの面子+1つの雀頭をそろえよう。',
      how: ['牌を1回タップで「待ち」を表示、もう1回タップで捨てる', '「ツモ!」で自分の和了、他の人の捨て牌で和了できるときは「ロン!」', 'テンパイしたら「リーチ」(1000点)。役は リーチ・門前ツモ・タンヤオ・役牌・七対子・対々和・一盃口・混一色・清一色。ロンは役が必要', '翻×1000点(5翻以上は満貫〜役満)。和了で +100〜、流局 +30〜、負けても +20'], legend: '' },
    { id: 'doubt', name: 'ダウト', short: 'ダウト', th: 'felt', desc: 'ウソをついてカードを出し切る。見やぶれ!', icon: ICON_DOUBT, create: createDoubt,
      intro: '3人のコンピュータとダウト。A→2→3…→K の順に、その数字だと言ってカードを裏向きで出します。ほんとでもウソでもOK。ウソだと思ったら「ダウト!」。',
      how: ['自分の番は、いまの数字(A→2→…→K)として1〜4枚えらんで出す(ウソでもOK)', '他の人が出したら「ダウト!」を押せる。ウソなら出した人が、ほんとなら指摘した人が、場のカードを全部ひきとる', '先に手札がなくなった人の勝ち。1位 +150、2位 +80、3位 +40。ダウト成功 +15、ウソが通ると +5'], legend: '' },
    { id: 'uno', name: 'ユニカード', short: 'ユニカード', th: 'felt', desc: '色か数字を合わせて、先に手札をなくす。', icon: ICON_UNICARD, create: createUnicard,
      intro: '3人のコンピュータと、色か数字を合わせて出していくカードゲーム。スキップ・リバース・ドロー2・ワイルドで流れが変わります。',
      how: ['場のカードと同じ色か同じ数字(記号)のカードを出す。出せないときは1枚ひく', '⊘=次の人をスキップ、⇄=向きが逆、+2=次の人が2枚ひく、★=好きな色にする、+4=好きな色&次の人が4枚ひく', '手札が1枚になったらすぐ「ラスト1枚!」ボタン。忘れると2枚ひくペナルティ', '先に手札をなくせば勝ち。1位 +150、2位 +80、3位 +40'], legend: '' },
    { id: 'beatlane', name: 'ビートレーン', short: 'ビートレーン', desc: '自作の曲に合わせて4レーンのノーツをたたく。', icon: ICON_BEATLANE, create: createBeatlane,
      intro: '落ちてくるノーツを、ラインに重なった瞬間にたたくリズムゲーム。曲は3つ。長いノーツは押しっぱなしにします。',
      how: ['スマホは4つのレーンをタップ(同時押しOK)。PCは D F J K キー', 'ぴったりなら PERFECT、少しずれると GREAT。のがすと MISS でゲージが減る', '長いノーツは押したままにして、最後に離す。ゲージがなくなる前に曲の最後までいこう'], legend: '' },
    { id: 'ball6', name: '6ボールパズル', short: '6ボール', desc: '同じ色を6つつなげて消す。ワザでCPUをこうげき!', icon: ICON_BALL6, create: createBall6,
      intro: '3つ1組のボールを落として、同じ色を6つ以上つなげて消す対CPUのパズル。ボールが積み上がってデッドラインを越えたら負け。CPUの盤をボールでいっぱいにすれば勝ちです。',
      how: ['◀▶で位置、⟳で色のならびをまわし、▼でおとす(PCは ←→・↑・↓キー)。一定時間たつと自動で落ちる', '同じ色を6つ以上つなげると消える。ならび方で「ワザ」になるとCPUにボールを送れる: ストレート(一直線の6個)・ピラミッド(3-2-1の三角)・ヘキサゴン(6個の輪)', 'CPUからも送られてくる(⚠ ふってくる)。こちらがワザを出すと、さきに打ち消せる'], legend: '' },
    { id: 'maketen', name: 'メイクテン', short: 'メイクテン', desc: '4つの数字を+−×÷で組み合わせて、10をつくる。', icon: ICON_MAKETEN, create: createMaketen,
      intro: '4つの数字を足す・引く・かける・わるで組み合わせて、ちょうど10にするパズル。進むほど、むずかしい組み合わせが出ます。',
      how: ['数字→記号(+−×÷)→もう1つの数字の順にタップすると、2つが1つに合体する', '最後の1つが10になれば正解。わり算で 5/2 のような分数になってもOK', '行きづまったら「もどす」「やりなおし」。スキップは -5秒。75秒でいくつ解けるかな'], legend: '' },
    { id: 'rogue', name: 'ほしの迷宮', short: 'ダンジョン', desc: '毎回ちがう迷宮を進む、本格ローグライクRPG。全8階、ボスはドラゴン。', icon: ICON_ROGUE, create: createRogue,
      intro: '入るたびに地形がかわる迷宮を、1歩ずつ進むRPG。モンスターをたおしてレベルを上げ、アイテムをひろい、8階のドラゴンをたおそう。HPが0になったらおしまいです。',
      how: ['矢印ボタン/キーボード(矢印・WASD)/画面のスワイプで1歩ずつ動く。モンスターに ぶつかると こうげき', '自分が1歩動くたびに、敵も1歩動く。まつ(スペース)や🧪(Qキー)も1ターン使う', '🪜で次の階へ。🧪=かいふく ⚔️=こうげき+2 🛡️=ぼうぎょ+2 💰=スコア。ねている💤敵には近づきすぎない'], legend: '' },
    { id: 'daifugo', name: '大富豪', short: '大富豪', th: 'felt', desc: '強いカードを出して、先に手札をなくす。', icon: ICON_DAIFUGO, create: createDaifugo,
      intro: '3人のコンピュータと大富豪(簡易ルール)。場に出ているカードと同じ枚数で、もっと強いカードを出します。いちばん強いのは「2」です。',
      how: ['同じ数字のカードをえらんで「だす」。場が空のときは自由に出せる', '強さは 3 < 4 < … < K < A < 2。全員がパスすると場が流れる', '8切り(場が流れる)・縛り(同じマークが続くとそのマークだけ)・革命(4枚出しで強さが逆転)あり','1位 +150、2位 +100、3位 +50。2位以内なら連戦、革命で +30'], legend: '' },
    { id: 'bbp', name: 'ブロックボール', short: 'ブロックボール', desc: 'ボールを打って、せまるブロックをくずす。', icon: ICON_BBP, create: createBlockBall,

    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return (h2 >>> 0).toString(16).padStart(8, '0') + (h1 >>> 0).toString(16).padStart(8, '0');

    if (!lsGet(LS_ACCT)) return;
    a.append(document.createTextNode('ログイン中: ' + Rank.name() + ' '));
    const out = el('button', 'pill'); out.type = 'button'; out.textContent = 'ログアウト';
    out.addEventListener('click', () => {
      if (!window.confirm('ログアウトしますか?(同じ名前とあいことばで、またログインできます)')) return;
      lsSet(LS_ACCT, ''); lsSet('arcade-name', ''); lsSet('arcade-uid', ''); location.reload();
    });
    a.append(out);
  }
  function acctModal() {
    const back = el('div', 'acct'); back.setAttribute('role', 'dialog'); back.setAttribute('aria-modal', 'true'); back.setAttribute('aria-label', 'アカウント');
    const box = el('div', 'acct-in'); back.append(box);
    let mode = 'new';
    const render = () => {
      box.textContent = '';
      box.append(bt('h2', '', 'ひまつぶしアーケードへようこそ'));
      box.append(bt('p', 'sub', 'ランキングや対戦に使う、あなたのアカウントをつくります。なまえと、4けたの数字(あいことば)だけです。'));
      const tabs = el('div', 'acct-tabs');
      [['new', 'はじめて'], ['login', 'ログイン']].forEach(([m, label]) => {
        const t = bt('button', 'pill', label); t.type = 'button'; t.setAttribute('aria-pressed', String(mode === m));
        t.addEventListener('click', () => { mode = m; render(); }); tabs.append(t);
      });
      box.append(tabs);
      const nm = bt('input', 'bt-sel'); nm.type = 'text'; nm.maxLength = 12; nm.placeholder = 'なまえ(12文字まで)'; nm.autocomplete = 'off'; nm.setAttribute('aria-label', 'なまえ'); nm.value = lsGet('arcade-name');
      const pn = bt('input', 'bt-sel'); pn.type = 'password'; pn.inputMode = 'numeric'; pn.maxLength = 4; pn.placeholder = 'あいことば(数字4けた)'; pn.autocomplete = 'off'; pn.setAttribute('aria-label', 'あいことば');
      const go = bt('button', 'btn', mode === 'new' ? 'アカウントをつくる' : 'ログイン'); go.type = 'button';
      const msg = bt('p', 'bt-msg', '');
      box.append(nm, pn, go, msg);
      if (mode === 'new') box.append(bt('p', 'sub', 'あいことばは、ほかの端末でログインするときに使います。わすれないでね。'));
      go.addEventListener('click', async () => {
        const name = nm.value.trim().slice(0, 12), pin = pn.value;
        if (!name) { msg.textContent = 'なまえを入れてください。'; return; }
        if (!/^\d{4}$/.test(pin)) { msg.textContent = 'あいことばは数字4けたです。'; return; }
        go.disabled = true; msg.textContent = 'かくにん中…';
        const key = nameKey(name);
        try {
          const cur = await rtdb('GET', '/accounts/' + key);
          if (mode === 'new') {
            if (cur) { msg.textContent = 'その名前はすでに使われています。自分の名前なら「ログイン」へ。'; go.disabled = false; return; }
            await rtdb('PUT', '/accounts/' + key, { name: name, pin: pinHash(key, pin), uid: Rank.uid, at: Date.now() });
            lsSet('arcade-name', name); lsSet(LS_ACCT, '1');
            back.remove(); acctLine(); Rank.fetch(tabId);
          } else {
            if (!cur) { msg.textContent = 'その名前のアカウントが見つかりません。'; go.disabled = false; return; }
            if (cur.pin !== pinHash(key, pin)) { msg.textContent = 'あいことばがちがいます。'; go.disabled = false; return; }
            lsSet('arcade-uid', String(cur.uid)); lsSet('arcade-name', String(cur.name)); lsSet(LS_ACCT, '1'); lsSet('arcade-sync', '1');
            location.reload();
          }
        } catch (e) { msg.textContent = '通信できませんでした。もう一度ためしてください。'; go.disabled = false; }
      });
    };
    render(); document.body.append(back);
    try { $('input', box).focus({ preventScroll: true }); } catch (e) {}
  }
  async function acctSync() {
    if (lsGet('arcade-sync') !== '1') return;
    lsSet('arcade-sync', '');
    await Promise.all(GAMES.map(async (g) => {
      try { const d = await rtdb('GET', '/scores/' + g.id + '/' + Rank.uid); if (d && Number(d.score) > (rec[g.id] || 0)) rec[g.id] = Number(d.score); } catch (e) {}
    }));
    saveRec(); renderHome();
  }

  $('#battleBtn').addEventListener('click', () => { battleMenu(); });
  $('#skinBtn').addEventListener('click', skinDialog);
  acctLine();
  setView('home');
  renderHome();
  Rank.init();
  acctSync();
  if (!lsGet(LS_ACCT)) acctModal();
})();
</script>

</body>
</html>
